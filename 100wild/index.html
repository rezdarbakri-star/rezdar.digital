const img = (p) => BASE + p;
function imgFail(e) {
  const el = e.target;
  const orig = el.dataset.orig || el.getAttribute("src");
  if (!el.dataset.orig) el.dataset.orig = orig;
  if (!el.dataset.step && orig.includes("bilder/tiger/")) { el.dataset.step = "1"; el.src = orig.replace("bilder/tiger/", "bilder/"); return; }
  el.style.display = "none";
}

/* ═══════════════════════════════════════════════════════════════
   UTILITY
   ═══════════════════════════════════════════════════════════════ */
function useInView(threshold = 0.2) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVis(true); }, { threshold });
    obs.observe(el); return () => obs.disconnect();
  }, [threshold]);
  return [ref, vis];
}

function Ctr({ target, suffix = "", dur = 1500, fmt }) {
  const [v, setV] = useState(0);
  const [ref, vis] = useInView(0.3);
  const started = useRef(false);
  useEffect(() => {
    if (vis && !started.current) {
      started.current = true; const s = performance.now();
      const tick = n => { const p = Math.min((n - s) / dur, 1); setV(Math.round((1 - Math.pow(1 - p, 3)) * target)); if (p < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
  }, [vis, target, dur]);
  return <span ref={ref}>{fmt ? fmt(v) : v}{suffix}</span>;
}

function Atmosphere({ themeId }) {
  const canvasRef = useRef(null);
  const anim = useRef(null);
  const theme = BIOME_THEMES[themeId] || BIOME_THEMES.hero;
  useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext("2d");
    const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; };
    resize(); window.addEventListener("resize", resize);
    const mk = () => {
      const b = { x: Math.random() * c.width, life: 1, decay: 0.0008 + Math.random() * 0.002, op: 0.15 + Math.random() * 0.3 };
      if (themeId === "arctic") return { ...b, y: -10, sz: 1.5 + Math.random() * 3, vx: (Math.random() - .5) * 1.2, vy: .5 + Math.random() * 1.2 };
      if (themeId === "amazon") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2.5, vx: (Math.random() - .5) * .4, vy: -.2 - Math.random() * .4, op: .25 + Math.random() * .4 };
      if (themeId === "savanna") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2.5, vx: .6 + Math.random() * 1.5, vy: (Math.random() - .5) * .3 };
      if (themeId === "ocean") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2, vx: (Math.random() - .5) * .3, vy: -.15 - Math.random() * .3, op: .2 + Math.random() * .35 };
      return { ...b, y: c.height + 10, sz: 1 + Math.random() * 2, vx: (Math.random() - .5) * .5, vy: -.3 - Math.random() * .6 };
    };
    const pts = Array.from({ length: 35 }, mk);
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) Object.assign(p, mk());
        ctx.globalAlpha = p.life * p.op; ctx.fillStyle = theme.particle;
        if (themeId === "savanna") ctx.fillRect(p.x, p.y, p.sz * 2, p.sz * .6);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      anim.current = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(anim.current); window.removeEventListener("resize", resize); };
  }, [themeId, theme.particle]);
  return <canvas ref={canvasRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 1, width: "100%", height: "100%" }} />;
}

function Section({ themeId, children, style = {} }) {
  const theme = BIOME_THEMES[themeId] || BIOME_THEMES.hero;
  const [ref, vis] = useInView(0.02);
  return (
    <section ref={ref} data-theme={themeId} style={{
      position: "relative", overflow: "hidden", minHeight: 200,
      background: `radial-gradient(ellipse at 50% 50%, ${theme.glow}, ${theme.bg})`,
      borderTop: `1px solid ${theme.accent}12`,
      opacity: vis ? 1 : 0, transform: vis ? "none" : "translateY(25px)",
      transition: "opacity 0.8s ease, transform 0.8s ease", ...style,
    }}>
      {vis && <Atmosphere themeId={themeId} />}
      <div style={{ position: "relative", zIndex: 2, padding: "clamp(60px, 10vw, 100px) clamp(16px, 4vw, 24px)" }}>{children}</div>
    </section>
  );
}

function Tag({ children, color = RED }) {
  return (
    <div style={{ fontFamily: "'Space Mono',monospace", fontSize: "clamp(9px,1vw,11px)", letterSpacing: 6, color, marginBottom: 20, textAlign: "center" }}>
      {children}<div style={{ width: 40, height: 2, background: color, margin: "14px auto 0" }} />
    </div>
  );
}

function Reveal({ children, delay = 0, style = {} }) {
  const [ref, vis] = useInView(0.15);
  return (
    <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? "translateY(0)" : "translateY(20px)",
      transition: `opacity 0.6s ease ${delay}s, transform 0.6s ease ${delay}s`, ...style }}>
      {children}
    </div>
  );
}

function LangToggle({ lang, setLang }) {
  return (
    <div className="lang-toggle">
      <button className={`lang-btn ${lang === "sv" ? "active" : ""}`} onClick={() => setLang("sv")}>SWE</button>
      <button className={`lang-btn ${lang === "en" ? "active" : ""}`} onClick={() => setLang("en")}>ENG</button>
    </div>
  );
}

function TripCarousel() {
  const lang = useLang();
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const trackRef = useRef(null);
  const n = TRIP_SLIDES.length;

  const scrollTo = (idx) => {
    const track = trackRef.current;
    if (!track) return;
    const card = track.children[idx];
    if (card) track.scrollTo({ left: card.offsetLeft - track.offsetLeft, behavior: "smooth" });
  };
  const go = (d) => { const next = (i + d + n) % n; setI(next); scrollTo(next); };

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => { setI((p) => { const nx = (p + 1) % n; scrollTo(nx); return nx; }); }, 4500);
    return () => clearInterval(t);
  }, [paused, n]);

  const onScroll = () => {
    const track = trackRef.current;
    if (!track) return;
    let closest = 0, min = Infinity;
    for (let k = 0; k < track.children.length; k++) {
      const d = Math.abs(track.children[k].offsetLeft - track.offsetLeft - track.scrollLeft);
      if (d < min) { min = d; closest = k; }
    }
    if (closest !== i) setI(closest);
  };

  return (
    <div onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)} style={{ position: "relative" }}>
      <div ref={trackRef} onScroll={onScroll} className="trip-track" style={{ display: "flex", gap: 10, overflowX: "auto", scrollSnapType: "x mandatory",
        scrollbarWidth: "none", msOverflowStyle: "none", borderRadius: 14, WebkitOverflowScrolling: "touch" }}>
        {TRIP_SLIDES.map((sl, idx) => (
          <div key={idx} className="trip-card" style={{ flex: "0 0 calc(50% - 5px)", scrollSnapAlign: "start" }}>
            <div style={{ position: "relative", aspectRatio: "4/5", borderRadius: 12, overflow: "hidden",
              border: "1px solid rgba(255,143,0,0.22)", background: "#1a0f04" }}>
              <img src={img(sl.src)} alt="" loading={idx < 2 ? "eager" : "lazy"}
                style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
                onError={imgFail} />
              <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(18,10,4,0.95) 0%, transparent 50%)", pointerEvents: "none" }} />
              <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "14px 14px 13px" }}>
                <p style={{ fontFamily: "'DM Sans',sans-serif", fontSize: "clamp(11px,1.05vw,13px)", color: "rgba(255,255,255,.93)", lineHeight: 1.5, margin: 0, textShadow: "0 1px 6px rgba(0,0,0,0.6)" }}>
                  {lang === "en" ? sl.en : sl.sv}
                </p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <button onClick={() => go(-1)} aria-label="Previous" style={{ position: "absolute", top: "calc(50% - 20px)", left: -6, transform: "translateY(-50%)", width: 40, height: 40, borderRadius: "50%", border: "1px solid rgba(255,255,255,0.2)", background: "rgba(18,10,4,0.72)", color: "white", fontSize: 19, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(4px)", zIndex: 3 }}>‹</button>
      <button onClick={() => go(1)} aria-label="Next" style={{ position: "absolute", top: "calc(50% - 20px)", right: -6, transform: "translateY(-50%)", width: 40, height: 40, borderRadius: "50%", border: "1px solid rgba(255,255,255,0.2)", background: "rgba(18,10,4,0.72)", color: "white", fontSize: 19, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(4px)", zIndex: 3 }}>›</button>
      <div style={{ display: "flex", justifyContent: "center", gap: 7, marginTop: 14, flexWrap: "wrap" }}>
        {TRIP_SLIDES.map((_, idx) => (
          <button key={idx} onClick={() => { setI(idx); scrollTo(idx); }} aria-label={`Go to ${idx + 1}`}
            style={{ width: idx === i ? 22 : 8, height: 8, borderRadius: 4, border: "none", cursor: "pointer", padding: 0,
              background: idx === i ? "#ff8f00" : "rgba(255,255,255,0.25)", transition: "all 0.3s ease" }} />
        ))}
      </div>
    </div>
  );
}

              <button onClick={() => setShowAll(true)} style={{ padding: "10px 20px", borderRadius: 999, border: "1px solid rgba(3,155,229,0.4)",
                background: "rgba(3,155,229,0.08)", color: "#4fc3f7", cursor: "pointer", fontFamily: "'Space Mono',monospace", fontSize: 10, letterSpacing: 3 }}>
                <T sv={`VISA ${EXPEDITIONS.length - SHOWN} TILL ↓`} en={`SHOW ${EXPEDITIONS.length - SHOWN} MORE ↓`} />
              </button>
            </div>
          )}
        </div>
      </Section>

      {/* ═══ 3B. RED BULL-ATLETER (bara i Red Bull-pitchen) ═══ */}
      {PITCH === "redbull" && (
        <Section themeId="brand">
          <div style={{ maxWidth: 1000, margin: "0 auto" }}>
            <Tag><T sv="RED BULL-ATLETER" en="RED BULL ATHLETES" /></Tag>
            <div style={{ textAlign: "center", marginBottom: 46 }}>
              <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,90px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}>
                <T sv="TRÄNA MED EN ATLET" en="TRAIN WITH AN ATHLETE" />
              </div>
              <p style={{ fontSize: "clamp(13px,1.2vw,16px)", color: "rgba(255,255,255,.45)", maxWidth: 580, margin: "16px auto 0", lineHeight: 1.7 }}>
                <T sv="Varje expedition kräver en färdighet. Innan jag ger mig ut tränar jag en dag med en Red Bull-atlet som behärskar den, och dagen blir en del av avsnittet."
                   en="Every expedition demands a skill. Before I head out, I spend a day training with a Red Bull athlete who has mastered it, and that day becomes part of the episode." />
              </p>
            </div>
            <div className="reach-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
              {[
                { icon: "🛶", skill: { sv: "KAJAK", en: "KAYAK" }, who: "Evy Leibfarth", exp: { sv: "Inför Borneos floder", en: "Before Borneo's rivers" } },
                { icon: "🏔️", skill: { sv: "HÖGHÖJD", en: "HIGH ALTITUDE" }, who: "Andrzej Bargiel", exp: { sv: "Inför Himalaya", en: "Before the Himalaya" } },
                { icon: "🤿", skill: { sv: "FRIDYKNING", en: "FREEDIVING" }, who: { sv: "Fridykare ur Red Bulls nätverk", en: "Freediver from the Red Bull network" }, exp: { sv: "Inför valarna i Tonga", en: "Before the whales in Tonga" } },
              ].map((a, ai) => (
                <Reveal key={ai} delay={ai * 0.1} style={{ background: "#0c0c12", borderRadius: 14, padding: "26px 22px", position: "relative", overflow: "hidden",
                  border: "1.5px solid rgba(227,0,15,0.3)", boxShadow: "0 0 30px rgba(227,0,15,0.08), inset 0 1px 0 rgba(227,0,15,0.15)" }}>
                  <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, transparent, ${RED}, transparent)` }} />
                  <div style={{ fontSize: 34 }}>{a.icon}</div>
                  <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 3, color: RED, marginTop: 14 }}>{L(a.skill)}</div>
                  <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(26px,3.4vw,36px)", color: "white", letterSpacing: 2, lineHeight: 1, marginTop: 6 }}>{typeof a.who === "string" ? a.who : L(a.who)}</div>
                  <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1, color: "rgba(255,255,255,.35)", marginTop: 10 }}>{L(a.exp)}</div>
                </Reveal>
              ))}
            </div>
            <p style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1, color: "rgba(255,255,255,.25)", marginTop: 20, textAlign: "center" }}>
              <T sv="Exempel. Atleterna väljs tillsammans med Red Bull." en="Examples. Athletes are chosen together with Red Bull." />
            </p>
          </div>
        </Section>
      )}

      {/* ═══ 4. REZDAR — FÖLJARE ═══ */}
      <Section themeId="stats" style={{ textAlign: "center" }}>
        <div>
          <Tag>CONTENT CREATOR</Tag>
          <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(55px,11vw,130px)", color: "white", letterSpacing: 5, lineHeight: .9 }}>REZDAR</div>
          <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(65px,13vw,170px)", color: RED, letterSpacing: -2, lineHeight: .9 }}><Ctr target={788} suffix=".000" /></div>
          <div className="stats-row" style={{ display: "flex", justifyContent: "center", gap: "clamp(30px,7vw,90px)", marginTop: 50, padding: "28px 0", borderTop: "1px solid rgba(255,255,255,.05)", borderBottom: "1px solid rgba(255,255,255,.05)" }}>
            {[{ l: "TIKTOK", v: 486 }, { l: "YOUTUBE", v: 214 }, { l: "INSTAGRAM", v: 78 }].map(s => (
              <div key={s.l}>
                <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(28px,5vw,58px)", color: RED }}><Ctr target={s.v} suffix="K" /></div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: "clamp(7px,.9vw,10px)", letterSpacing: 4, color: "rgba(232,228,223,.4)", marginTop: 4 }}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </Section>

      {/* ═══ 5. 2027 — VIDEOR OCH VISNINGAR ═══ */}
      <Section themeId="reach" style={{ textAlign: "center" }}>
        <div style={{ maxWidth: 960, margin: "0 auto" }}>
          <Tag color="#fbbf24"><T sv="PILOTAVSNITTET" en="THE PILOT EPISODE" /></Tag>
          <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,90px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}>TIGER ISLAND</div>
          <p style={{ fontSize: "clamp(13px,1.2vw,16px)", color: "rgba(255,255,255,.45)", maxWidth: 560, margin: "16px auto 0", lineHeight: 1.7 }}>
            <T sv="Klippen från Bardia på det engelska kontot @rezdarwild. Serien når redan en internationell publik."
               en="The clips from Bardia on the English account @rezdarwild. The series is already reaching an international audience." />
          </p>
          <div className="reach-grid" style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 28, marginTop: 40, alignItems: "center", textAlign: "left" }}>
            <Reveal style={{ borderRadius: 16, overflow: "hidden", border: "1.5px solid rgba(251,191,36,0.3)", boxShadow: "0 0 50px rgba(251,191,36,0.08)" }}>
              <img src={PROOF_IMG} alt="@rezdarwild, Bardia-klippen" style={{ display: "block", width: "100%", height: "auto" }} />
            </Reveal>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {[
                { v: 353, s: "K", sv: "Mest sedda klippet", en: "Most viewed clip" },
                { v: 266, s: "K", sv: "Trädkojan i tigerterritoriet", en: "The treehouse in tiger territory" },
                { v: 96, s: "K", sv: "Tigern på vägen", en: "The tiger on the trail" },
                { v: 793, s: "K", sv: "Visningar på @rezdarwild", en: "Views on @rezdarwild", big: true },
              ].map((c, ci) => (
                <Reveal key={ci} delay={ci * 0.08} style={{ background: c.big ? "rgba(251,191,36,0.06)" : "#0c0c12", border: `1px solid rgba(251,191,36,${c.big ? 0.35 : 0.15})`, borderRadius: 12, padding: "14px 18px", display: "flex", alignItems: "baseline", gap: 14 }}>
                  <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: c.big ? "clamp(44px,6vw,64px)" : "clamp(34px,4.5vw,48px)", color: c.big ? "#fbbf24" : "white", lineHeight: 1, minWidth: "3.2ch" }}><Ctr target={c.v} suffix={c.s} /></div>
                  <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 10, letterSpacing: 1.5, color: "rgba(255,255,255,.55)", lineHeight: 1.5 }}>{lang === "en" ? c.en : c.sv}</div>
                </Reveal>
              ))}
            </div>
          </div>

          <div style={{ height: 1, background: "rgba(255,255,255,.06)", margin: "64px auto 56px", maxWidth: 600 }} />
          <Tag color="#fbbf24"><T sv="2027 I SIFFROR" en="2027 IN NUMBERS" /></Tag>
          <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,90px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}>
            <T sv="FÖRVÄNTAD RÄCKVIDD" en="EXPECTED REACH" />
          </div>
          <p style={{ fontSize: "clamp(13px,1.2vw,16px)", color: "rgba(255,255,255,.4)", maxWidth: 560, margin: "16px auto 0", lineHeight: 1.7 }}>
            <T sv={`${EXP_2027} expeditioner under 2027. ${TT_PER_EXP} kortformatsvideor och ${YT_PER_EXP} YouTube-avsnitt från varje expedition.`}
               en={`${EXP_2027} expeditions in 2027. ${TT_PER_EXP} short-form videos and ${YT_PER_EXP} YouTube episodes from every expedition.`} />
          </p>
          <div className="reach-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginTop: 44 }}>
            {[
              { v: TT_2027, sv: "TIKTOK & REELS", en: "TIKTOK & REELS", sub: { sv: `Snitt ${fmtK(TT_AVG / 1000)}K per video`, en: `Avg ${fmtK(TT_AVG / 1000)}K per video` } },
              { v: YT_2027, sv: "YOUTUBE-AVSNITT", en: "YOUTUBE EPISODES", sub: { sv: `Snitt ${fmtK(YT_AVG / 1000)}K per avsnitt`, en: `Avg ${fmtK(YT_AVG / 1000)}K per episode` } },
            ].map((c, ci) => (
              <Reveal key={ci} delay={ci * 0.1} style={{ background: "#0c0c12", border: "1px solid rgba(251,191,36,0.15)", borderRadius: 14, padding: "28px 20px" }}>
                <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(56px,8vw,90px)", color: "white", lineHeight: .9 }}><Ctr target={c.v} /></div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 10, letterSpacing: 4, color: "#fbbf24", marginTop: 10 }}>{lang === "en" ? c.en : c.sv}</div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1, color: "rgba(255,255,255,.3)", marginTop: 8 }}>{L(c.sub)}</div>
              </Reveal>
            ))}
            <Reveal delay={0.2} style={{ background: "rgba(251,191,36,0.06)", border: "1.5px solid rgba(251,191,36,0.35)", borderRadius: 14, padding: "28px 20px", boxShadow: "0 0 40px rgba(251,191,36,0.08)" }}>
              <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(56px,8vw,90px)", color: "#fbbf24", lineHeight: .9 }}>
                <Ctr target={Math.round(VIEWS_2027 / 100000)} fmt={fmtM} suffix="M" />
              </div>
              <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 10, letterSpacing: 4, color: "#fbbf24", marginTop: 10 }}><T sv="VISNINGAR" en="VIEWS" /></div>
              <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1, color: "rgba(255,255,255,.3)", marginTop: 8 }}><T sv="Organiskt, utan paid boost" en="Organic, before paid boost" /></div>
            </Reveal>
          </div>
          <p style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1, color: "rgba(255,255,255,.25)", marginTop: 22, lineHeight: 1.7 }}>
            <T sv="Snitten bygger på reseserien på YouTube (11 avsnitt) och tidigare sponsrade kortformat."
               en="Averages are based on the travel series on YouTube (11 episodes) and previous sponsored short-form content." />
          </p>
        </div>
      </Section>

      {/* ═══ 6. PARTNERS ═══ */}
      <Section themeId="brand">
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 50 }}>
            <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,90px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}>PARTNERS</div>
          </div>

          {/* Locked in */}
          {LOCKED_LIST.map((LOCKED) => (
          <Reveal key={LOCKED.name} style={{
            background: "#0c0c12", borderRadius: 14, padding: "24px 24px", position: "relative", overflow: "hidden", marginBottom: 20,
            border: `1.5px solid ${LOCKED.color}30`, boxShadow: `0 0 30px ${LOCKED.color}08, inset 0 1px 0 ${LOCKED.color}15`,
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap",
          }}>
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, transparent, ${LOCKED.color}, transparent)` }} />
            <div>
              <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(30px,4.5vw,44px)", color: LOCKED.color, letterSpacing: 3, lineHeight: 1 }}>{LOCKED.name}</div>
              <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 3, color: "rgba(255,255,255,.3)", marginTop: 6 }}>{L(LOCKED.tagline)}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div className="official-badge">
                <svg viewBox="0 0 24 24"><path d="M12 1l3.09 6.26L22 8.27l-5 4.87 1.18 6.88L12 16.77l-6.18 3.25L7 13.14 2 8.27l6.91-1.01L12 1z"/></svg>
                LOCKED IN · <T sv="OFFICIELL SPONSOR" en="OFFICIAL SPONSOR" />
              </div>
            </div>
          </Reveal>
          ))}

          {/* The partner this pitch is for */}
          <Reveal delay={0.12} style={{
            background: "#0c0c12", borderRadius: 14, padding: "32px 28px", position: "relative", overflow: "hidden",
            border: `1.5px solid ${ASK.color}45`, boxShadow: `0 0 50px ${ASK.color}14, inset 0 1px 0 ${ASK.color}20`,
          }}>
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: `linear-gradient(90deg, transparent, ${ASK.color}, transparent)` }} />
            <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 3, color: ASK.color, marginBottom: 8 }}>
              <T sv="SÅ SYNS NI I 100WILD" en="HOW YOU APPEAR IN 100WILD" />
            </div>
            <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(36px,6vw,60px)", color: ASK.color, letterSpacing: 3, lineHeight: 1 }}>{ASK.name}</div>
            <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 3, color: "rgba(255,255,255,.3)", margin: "6px 0 22px" }}>{L(ASK.tagline)}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {L(ASK.points).map((p, pi) => (
                <div key={pi} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <div style={{ width: 5, height: 5, borderRadius: "50%", background: ASK.color, marginTop: 8, flexShrink: 0, boxShadow: `0 0 6px ${ASK.color}` }} />
                  <span style={{ fontSize: 14, color: "rgba(255,255,255,.6)", lineHeight: 1.7 }}>{p}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 24 }}>
              {[
                { sv: `${EXPEDITIONS.length} expeditioner`, en: `${EXPEDITIONS.length} expeditions` },
                { sv: "18 månader", en: "18 months" },
                { sv: "YouTube · TikTok · Instagram", en: "YouTube · TikTok · Instagram" },
              ].map((c, ci) => (
                <span key={ci} style={{ padding: "5px 11px", borderRadius: 6, background: `${ASK.color}12`, border: `1px solid ${ASK.color}30`,
                  fontFamily: "'Space Mono',monospace", fontSize: 9, letterSpacing: 1.5, color: ASK.color }}>{L(c)}</span>
              ))}
            </div>
          </Reveal>
        </div>
      </Section>

      {/* ═══ 7. CTA ═══ */}
      <Section themeId="cta" style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontFamily: "'Bebas Neue',sans-serif", lineHeight: .85 }}>
            <div className="glitch" style={{ fontSize: "clamp(70px,14vw,200px)", color: "white", letterSpacing: 3 }}>PRESS</div>
            <div className="glitch" style={{ fontSize: "clamp(70px,14vw,200px)", color: RED, letterSpacing: 3 }}>START.</div>
          </div>
          <div style={{ width: 40, height: 3, background: RED, margin: "20px auto 0" }} />
          <p className="cta-desc" style={{ fontFamily: "'DM Sans',sans-serif", fontSize: "clamp(13px,1.3vw,17px)", color: "rgba(232,228,223,.45)", lineHeight: 1.7, maxWidth: 420, margin: "28px auto 0" }}>
            <T sv="Var med och skapa upplevelser tittarna aldrig glömmer." en="Help create experiences viewers never forget." />
          </p>
        </div>
      </Section>

      <div style={{ padding: "20px clamp(16px,4vw,40px)", background: DARK, borderTop: "1px solid rgba(255,255,255,.03)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: 12, letterSpacing: 3, color: RED, opacity: .5 }}>100WILD</span>
        <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 2, color: "rgba(255,255,255,.15)" }}>100 WILD · 2027</span>
      </div>
    </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

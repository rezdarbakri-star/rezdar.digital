/* ═══════════════════════════════════════════════════════════════
   UTILITY
   ═══════════════════════════════════════════════════════════════ */
function useInView(threshold = 0.2) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVis(true); }, { threshold });
    obs.observe(el); return () => obs.disconnect();
  }, [threshold]);
  return [ref, vis];
}

function Ctr({ target, suffix = "", dur = 1500 }) {
  const [v, setV] = useState(0);
  const [ref, vis] = useInView(0.3);
  const started = useRef(false);
  useEffect(() => {
    if (vis && !started.current) {
      started.current = true; const s = performance.now();
      const tick = n => { const p = Math.min((n - s) / dur, 1); setV(Math.round((1 - Math.pow(1 - p, 3)) * target)); if (p < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
  }, [vis, target, dur]);
  return <span ref={ref}>{v}{suffix}</span>;
}

function Ring({ pct, color, size = 68, stroke = 3, children }) {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)} strokeLinecap="round"
          style={{ transition: "stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1)" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>{children}</div>
    </div>
  );
}

function Atmosphere({ themeId }) {
  const canvasRef = useRef(null);
  const anim = useRef(null);
  const theme = BIOME_THEMES[themeId] || BIOME_THEMES.hero;
  useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext("2d");
    const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; };
    resize(); window.addEventListener("resize", resize);
    const mk = () => {
      const b = { x: Math.random() * c.width, life: 1, decay: 0.0008 + Math.random() * 0.002, op: 0.15 + Math.random() * 0.3 };
      if (themeId === "arctic") return { ...b, y: -10, sz: 1.5 + Math.random() * 3, vx: (Math.random() - .5) * 1.2, vy: .5 + Math.random() * 1.2 };
      if (themeId === "amazon") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2.5, vx: (Math.random() - .5) * .4, vy: -.2 - Math.random() * .4, op: .25 + Math.random() * .4 };
      if (themeId === "savanna") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2.5, vx: .6 + Math.random() * 1.5, vy: (Math.random() - .5) * .3 };
      if (themeId === "ocean") return { ...b, y: Math.random() * c.height, sz: 1 + Math.random() * 2, vx: (Math.random() - .5) * .3, vy: -.15 - Math.random() * .3, op: .2 + Math.random() * .35 };
      return { ...b, y: c.height + 10, sz: 1 + Math.random() * 2, vx: (Math.random() - .5) * .5, vy: -.3 - Math.random() * .6 };
    };
    const pts = Array.from({ length: 35 }, mk);
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) Object.assign(p, mk());
        ctx.globalAlpha = p.life * p.op; ctx.fillStyle = theme.particle;
        if (themeId === "savanna") ctx.fillRect(p.x, p.y, p.sz * 2, p.sz * .6);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      anim.current = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(anim.current); window.removeEventListener("resize", resize); };
  }, [themeId, theme.particle]);
  return <canvas ref={canvasRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 1, width: "100%", height: "100%" }} />;
}

function Section({ themeId, children, style = {} }) {
  const theme = BIOME_THEMES[themeId] || BIOME_THEMES.hero;
  const [ref, vis] = useInView(0.02);
  return (
    <section ref={ref} data-theme={themeId} style={{
      position: "relative", overflow: "hidden", minHeight: 200,
      background: `radial-gradient(ellipse at 50% 50%, ${theme.glow}, ${theme.bg})`,
      borderTop: `1px solid ${theme.accent}12`,
      opacity: vis ? 1 : 0, transform: vis ? "none" : "translateY(25px)",
      transition: "opacity 0.8s ease, transform 0.8s ease", ...style,
    }}>
      {vis && <Atmosphere themeId={themeId} />}
      <div style={{ position: "relative", zIndex: 2, padding: "clamp(60px, 10vw, 100px) clamp(16px, 4vw, 24px)" }}>{children}</div>
    </section>
  );
}

function Tag({ children, color = RED }) {
  return (
    <div style={{ fontFamily: "'Space Mono',monospace", fontSize: "clamp(9px,1vw,11px)", letterSpacing: 6, color, marginBottom: 20, textAlign: "center" }}>
      {children}<div style={{ width: 40, height: 2, background: color, margin: "14px auto 0" }} />
    </div>
  );
}

function Reveal({ children, delay = 0, style = {} }) {
  const [ref, vis] = useInView(0.15);
  return (
    <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? "translateY(0)" : "translateY(20px)",
      transition: `opacity 0.6s ease ${delay}s, transform 0.6s ease ${delay}s`, ...style }}>
      {children}
    </div>
  );
}

function TripCarousel() {
  const { lang } = useLang();
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const trackRef = useRef(null);
  const n = TRIP_SLIDES.length;

  const scrollTo = (idx) => {
    const track = trackRef.current;
    if (!track) return;
    const card = track.children[idx];
    if (card) track.scrollTo({ left: card.offsetLeft - track.offsetLeft, behavior: "smooth" });
  };
  const go = (d) => { const next = (i + d + n) % n; setI(next); scrollTo(next); };

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => { setI((p) => { const nx = (p + 1) % n; scrollTo(nx); return nx; }); }, 4500);
    return () => clearInterval(t);
  }, [paused, n]);

  // keep dots in sync when user scrolls/swipes manually
  const onScroll = () => {
    const track = trackRef.current;
    if (!track) return;
    let closest = 0, min = Infinity;
    for (let k = 0; k < track.children.length; k++) {
      const d = Math.abs(track.children[k].offsetLeft - track.offsetLeft - track.scrollLeft);
      if (d < min) { min = d; closest = k; }
    }
    if (closest !== i) setI(closest);
  };

  return (
    <div onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)} style={{ position: "relative" }}>
      <div ref={trackRef} onScroll={onScroll} className="trip-track" style={{ display: "flex", gap: 10, overflowX: "auto", scrollSnapType: "x mandatory",
        scrollbarWidth: "none", msOverflowStyle: "none", borderRadius: 14, WebkitOverflowScrolling: "touch" }}>
        {TRIP_SLIDES.map((sl, idx) => (
          <div key={idx} className="trip-card" style={{ flex: "0 0 calc(50% - 5px)", scrollSnapAlign: "start" }}>
            <div style={{ position: "relative", aspectRatio: "4/5", borderRadius: 12, overflow: "hidden",
              border: "1px solid rgba(255,143,0,0.22)", background: "#1a0f04" }}>
              <img src={sl.src} alt="" loading={idx < 2 ? "eager" : "lazy"}
                style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
                onError={e => { e.target.style.display = "none"; }} />
              <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(18,10,4,0.95) 0%, transparent 50%)", pointerEvents: "none" }} />
              <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "14px 14px 13px" }}>
                <p style={{ fontFamily: "'DM Sans',sans-serif", fontSize: "clamp(11px,1.05vw,13px)", color: "rgba(255,255,255,.93)", lineHeight: 1.5, margin: 0, textShadow: "0 1px 6px rgba(0,0,0,0.6)" }}>
                  {lang === "en" ? sl.en : sl.sv}
                </p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* arrows */}
      <button onClick={() => go(-1)} aria-label="Previous" style={{ position: "absolute", top: "calc(50% - 20px)", left: -6, transform: "translateY(-50%)", width: 40, height: 40, borderRadius: "50%", border: "1px solid rgba(255,255,255,0.2)", background: "rgba(18,10,4,0.72)", color: "white", fontSize: 19, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(4px)", zIndex: 3 }}>‹</button>
      <button onClick={() => go(1)} aria-label="Next" style={{ position: "absolute", top: "calc(50% - 20px)", right: -6, transform: "translateY(-50%)", width: 40, height: 40, borderRadius: "50%", border: "1px solid rgba(255,255,255,0.2)", background: "rgba(18,10,4,0.72)", color: "white", fontSize: 19, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(4px)", zIndex: 3 }}>›</button>

      {/* dots */}
      <div style={{ display: "flex", justifyContent: "center", gap: 7, marginTop: 14, flexWrap: "wrap" }}>
        {TRIP_SLIDES.map((_, idx) => (
          <button key={idx} onClick={() => { setI(idx); scrollTo(idx); }} aria-label={`Go to ${idx + 1}`}
            style={{ width: idx === i ? 22 : 8, height: 8, borderRadius: 4, border: "none", cursor: "pointer", padding: 0,
              background: idx === i ? "#ff8f00" : "rgba(255,255,255,0.25)", transition: "all 0.3s ease" }} />
        ))}
      </div>
    </div>
  );
}

                    <div>
                      <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: 22, letterSpacing: 3, color: "white" }}>{cat.name}</div>
                      <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, color: `${cat.color}80`, letterSpacing: 2 }}>TIER {ci + 1} · {unlocked}/{cat.skills.length}</div>
                    </div>
                  </div>
                  <div style={{ height: 2, borderRadius: 1, background: "rgba(255,255,255,.04)", marginBottom: 14, overflow: "hidden" }}>
                    <div style={{ "--fill": `${(unlocked / cat.skills.length) * 100}%`, width: 0, height: "100%", background: cat.color, borderRadius: 1, animation: "barFill 1s 0.5s ease forwards" }} />
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(70px, 1fr))", gap: 8 }}>
                    {cat.skills.map((s, si) => (
                      <div key={si} className="cc" style={{ aspectRatio: "1", borderRadius: 10,
                        background: s.mystery ? "#111" : s.active ? `${cat.color}15` : "#0f0f15",
                        border: s.active ? `1.5px solid ${cat.color}` : "1px solid rgba(255,255,255,0.04)",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4,
                        boxShadow: s.active ? `0 2px 16px ${cat.color}20` : "none",
                        animation: `cardPop 0.4s ease ${si * 0.05}s both` }}>
                        <span style={{ fontSize: 20, filter: !s.active && !s.mystery ? "grayscale(1) brightness(0.25)" : "none" }}>{s.icon}</span>
                        <span style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: 8, letterSpacing: 1.5,
                          color: s.mystery ? "rgba(255,255,255,.1)" : s.active ? "rgba(255,255,255,.8)" : "rgba(255,255,255,.15)" }}>
                          {s.mystery ? "???" : s.active ? s.name.toUpperCase() : "LOCKED"}</span>
                      </div>
                    ))}
                  </div>
                </Reveal>
              );
            })}
          </div>
        </div>
      </Section>

      {/* ═══ 4. ANIMATION SYSTEM ═══ */}
      <Section themeId="anim">
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <Tag color="#8b5cf6">BROADCAST GRAPHICS</Tag>
          <div style={{ textAlign: "center", marginBottom: 40 }}>
            <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,80px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}>ENCOUNTER<br/>ANIMATION</div>
            <p style={{ fontSize: "clamp(13px,1.2vw,16px)", color: "rgba(255,255,255,.35)", marginTop: 16, maxWidth: 500, margin: "16px auto 0", lineHeight: 1.7 }}>
              <T sv="Varje ny art triggar en animerad pop-up i realtid. Rarity-tiers skapar tittarengagemang — alla väntar på nästa Legendary."
                 en="Every new species triggers an animated pop-up in real time. Rarity tiers create viewer engagement — everyone waits for the next Legendary." />
            </p>
          </div>
          <div className="catch-row" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
            {CATCH_DEMO.map((a, i) => <CatchCard key={a.name + lang} animal={a} index={i} />)}
          </div>
        </div>
      </Section>

      {/* ═══ 6. STATS ═══ */}
      <Section themeId="stats" style={{ textAlign: "center" }}>
        <div>
          <Tag>CONTENT CREATOR</Tag>
          <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(55px,11vw,130px)", color: "white", letterSpacing: 5, lineHeight: .9 }}>REZDAR</div>
          <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(65px,13vw,170px)", color: RED, letterSpacing: -2, lineHeight: .9 }}><Ctr target={750} suffix=".000" /></div>
          <div className="stats-row" style={{ display: "flex", justifyContent: "center", gap: "clamp(30px,7vw,90px)", marginTop: 50, padding: "28px 0", borderTop: "1px solid rgba(255,255,255,.05)", borderBottom: "1px solid rgba(255,255,255,.05)" }}>
            {[{ l: "TIKTOK", v: 486 }, { l: "YOUTUBE", v: 214 }, { l: "INSTAGRAM", v: 78 }].map(s => (
              <div key={s.l}>
                <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(28px,5vw,58px)", color: RED }}><Ctr target={s.v} suffix="K" /></div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: "clamp(7px,.9vw,10px)", letterSpacing: 4, color: "rgba(232,228,223,.4)", marginTop: 4 }}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </Section>

      {/* ═══ 7. BRAND FIT ═══ */}
      <Section themeId="brand">
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <Tag><T sv="PARTNERS" en="PARTNERS" /></Tag>
          <div style={{ textAlign: "center", marginBottom: 50 }}>
            <div className="glitch" style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(40px,8vw,90px)", color: "white", letterSpacing: 3, lineHeight: 0.9 }}><T sv="PARTNERS" en="PARTNERS" /></div>
            <p style={{ fontSize: "clamp(13px,1.2vw,16px)", color: "rgba(255,255,255,.35)", marginTop: 16, maxWidth: 500, margin: "16px auto 0", lineHeight: 1.7 }}>
              <T sv="Stora varumärken är med och sponsrar serien. Produkten syns i rätt kontext — naturligt, trovärdigt, i verkligheten."
                 en="Major brands are partnering on the series. The product appears in the right context — naturally, credibly, in the real world." />
            </p>
          </div>

          {/* Partner brands */}
          <div className="brand-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
            {BRANDS.filter(b => b.status === "active").map((b, bi) => (
              <Reveal key={b.name} delay={bi * 0.12} style={{
                background: "#0c0c12", borderRadius: 14, padding: "28px 24px", position: "relative", overflow: "hidden",
                border: `1.5px solid ${b.color}30`,
                boxShadow: `0 0 30px ${b.color}08, inset 0 1px 0 ${b.color}15`,
              }}>
                {/* Glowing top accent line */}
                <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3,
                  background: `linear-gradient(90deg, transparent, ${b.color}, transparent)` }} />

                {/* LOCKED IN badge */}
                <div style={{ position: "absolute", top: 16, right: 16, display: "flex", alignItems: "center", gap: 5,
                  padding: "5px 10px", borderRadius: 6,
                  background: `${b.color}12`, border: `1px solid ${b.color}35`,
                  animation: "badgePulse 3s ease infinite",
                  boxShadow: `0 0 12px ${b.color}20`,
                }}>
                  <svg viewBox="0 0 24 24" width="10" height="10" fill={b.color}><path d="M12 1l3.09 6.26L22 8.27l-5 4.87 1.18 6.88L12 16.77l-6.18 3.25L7 13.14 2 8.27l6.91-1.01L12 1z"/></svg>
                  <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 2, color: b.color, fontWeight: 700 }}><T sv="PARTNER" en="PARTNER" /></span>
                </div>

                <div style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: "clamp(32px,5vw,48px)", color: b.color, letterSpacing: 3 }}>{b.name}</div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 3, color: "rgba(255,255,255,.2)", marginBottom: 20 }}>{b.tagline}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {b.points.map((p, pi) => (
                    <div key={pi} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div style={{ width: 4, height: 4, borderRadius: "50%", background: b.color, marginTop: 7, flexShrink: 0 }} />
                      <span style={{ fontSize: 13, color: "rgba(255,255,255,.45)", lineHeight: 1.7 }}>{p}</span>
                    </div>
                  ))}
                </div>
              </Reveal>
            ))}
          </div>

        </div>
      </Section>

      {/* ═══ 8. CTA ═══ */}
      <Section themeId="cta" style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontFamily: "'Bebas Neue',sans-serif", lineHeight: .85 }}>
            <div className="glitch" style={{ fontSize: "clamp(70px,14vw,200px)", color: "white", letterSpacing: 3 }}>PRESS</div>
            <div className="glitch" style={{ fontSize: "clamp(70px,14vw,200px)", color: RED, letterSpacing: 3 }}>START.</div>
          </div>
          <div style={{ width: 40, height: 3, background: RED, margin: "20px auto 0" }} />
          <p className="cta-desc" style={{ fontFamily: "'DM Sans',sans-serif", fontSize: "clamp(13px,1.3vw,17px)", color: "rgba(232,228,223,.45)", marginTop: 28, lineHeight: 1.7, maxWidth: 420, margin: "28px auto 0" }}>
            <T sv={<>En titelpartner per expedition. När platsen är tagen är den tagen, och serien rullar vidare.</>}
               en={<>One title partner per expedition. Once the slot is taken, it's taken, and the series moves on.</>} />
          </p>
        </div>
      </Section>

      {/* Footer */}
      <div style={{ padding: "20px clamp(16px,4vw,40px)", background: DARK, borderTop: "1px solid rgba(255,255,255,.03)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontFamily: "'Bebas Neue',sans-serif", fontSize: 12, letterSpacing: 3, color: RED, opacity: .5 }}>100WILD</span>
        <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 8, letterSpacing: 2, color: "rgba(255,255,255,.15)" }}>100 WILD · 2026</span>
      </div>
    </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

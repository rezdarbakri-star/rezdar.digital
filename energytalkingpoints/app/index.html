<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Understand Energy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🔥</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { min-height: 100vh; }
  body { font-family: 'Outfit', sans-serif; background: #0B1628; color: #fff; -webkit-font-smoothing: antialiased; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #FF6B1A; cursor: grab; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,107,26,0.2); border-radius: 3px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const QUESTIONS = [
  { id: 1, category: "ENERGY", question: "What percentage of the world's energy comes from fossil fuels?", type: "slider", min: 0, max: 100, unit: "%", correctAnswer: 80, averageGuess: 42, source: "IEA World Energy Outlook 2023", explanation: "Despite decades of investment in renewables, fossil fuels still provide about 80% of global energy. Solar and wind combined provide roughly 4-5%. Most people dramatically underestimate how dependent civilization is on fossil fuels.", insight: "The gap between perception and reality on energy is one of the biggest misconceptions in the modern world.", icon: "⚡" },
  { id: 2, category: "CLIMATE", question: "Since 1920, how much have climate-related disaster deaths declined?", type: "choice", options: ["Increased 50%", "Stayed about the same", "Declined ~50%", "Declined ~98%"], correctIndex: 3, source: "EM-DAT International Disaster Database", explanation: "Climate-related deaths have plummeted by approximately 98% over the last century — from around 500,000 per year to under 15,000 — even as CO₂ levels rose. Fossil-fuel-powered technology made us dramatically safer.", insight: "More CO₂ in the atmosphere, yet 98% fewer climate deaths. Affordable energy is the ultimate climate protection.", icon: "🌍" },
  { id: 3, category: "POVERTY", question: "What percentage of the world lived in extreme poverty in 1800?", type: "slider", min: 0, max: 100, unit: "%", correctAnswer: 90, averageGuess: 50, source: "Our World in Data / World Bank", explanation: "In 1800, roughly 90% of humanity lived in extreme poverty. Today it's under 10%. This is the greatest improvement in human living standards in history — driven by access to cheap, reliable energy.", insight: "The single greatest poverty reduction in human history happened during the era of fossil fuel use.", icon: "📊" },
  { id: 4, category: "ENERGY", question: "How many people in the world lack access to reliable electricity?", type: "choice", options: ["About 100 million", "About 750 million", "About 2 billion", "About 3.5 billion"], correctIndex: 2, source: "IEA / UN", explanation: "Roughly 2 billion people still lack reliable electricity access, and billions more have only intermittent access. This energy poverty is one of the leading causes of preventable death and suffering.", insight: "Energy poverty kills. Access to affordable, reliable energy is the #1 factor in escaping poverty.", icon: "💡" },
  { id: 5, category: "CLIMATE", question: "Which kills more people globally each year: cold or heat?", type: "choice", options: ["Heat kills 5x more", "Heat kills 2x more", "About the same", "Cold kills 10x more"], correctIndex: 3, source: "The Lancet, 2021 — 68 million deaths studied", explanation: "Cold kills roughly 10 times more people than heat globally. A Lancet study covering 68 million deaths across 43 countries found that cold-related mortality vastly exceeds heat-related mortality.", insight: "The narrative focuses on heat waves, but cold is by far the bigger killer. Affordable heating saves millions of lives.", icon: "🌡️" },
  { id: 6, category: "ECONOMICS", question: "What would it cost to store just 3 days of global energy in batteries?", type: "choice", options: ["$5 trillion", "$50 trillion", "$200 trillion", "$500+ trillion"], correctIndex: 3, source: "Energy Talking Points / EIA", explanation: "Storing just 3 days of global energy in batteries would cost over $500 trillion at current prices — roughly 5x global GDP.", insight: "The storage problem alone makes a rapid fossil fuel phase-out economically impossible with current technology.", icon: "🔋" },
  { id: 7, category: "ENERGY", question: "What percentage of global energy do solar and wind provide combined?", type: "slider", min: 0, max: 50, unit: "%", correctAnswer: 5, averageGuess: 25, source: "BP Statistical Review / IEA", explanation: "Despite massive investment and subsidies, solar and wind combined provide only about 4-5% of total global energy.", insight: "We hear about renewables constantly, yet they provide a tiny fraction of global energy. The gap between narrative and reality is enormous.", icon: "☀️" },
  { id: 8, category: "GEOPOLITICS", question: "How much did Europe's electricity prices increase after expanding wind and solar?", type: "choice", options: ["Decreased 20%", "Stayed flat", "Doubled", "Tripled or more"], correctIndex: 3, source: "Eurostat", explanation: "Countries that aggressively pursued solar and wind saw electricity prices rise to 2-3x those of countries with reliable energy. German households pay roughly triple US rates.", insight: "The promise was cheaper energy. The result was some of the most expensive electricity in the world.", icon: "🇪🇺" },
  { id: 9, category: "CLIMATE", question: "Since 1980, has the area burned by wildfires globally increased or decreased?", type: "choice", options: ["Increased dramatically", "Increased slightly", "Stayed the same", "Decreased ~25%"], correctIndex: 3, source: "NASA / Royal Society", explanation: "The total global area burned by wildfires has actually decreased by roughly 25% since the early 1980s, partly due to human development and fire suppression technology.", insight: "Headlines show the worst fires. Data shows the global trend is improving.", icon: "🔥" },
  { id: 10, category: "ECONOMICS", question: "Per unit of energy produced, who gets more subsidies: fossil fuels or renewables?", type: "choice", options: ["Fossil fuels get 10x more", "About equal", "Renewables get 10x more", "Renewables get 50x+ more"], correctIndex: 3, source: "EIA / Energy Talking Points", explanation: "Per unit of energy actually produced, renewable energy receives roughly 50x more in subsidies compared to fossil fuels.", insight: "The 'fossil fuel subsidies' talking point collapses when you look at subsidies per unit of energy delivered.", icon: "💰" },
];

const T = { bg: "#0B1628", primary: "#FF6B1A", primaryLight: "#FF8C42", amber: "#FFAA00", flame: "#FF4500", navyLight: "#122240", navyMid: "#1A2D4D", textDim: "rgba(255,255,255,0.5)", textFaint: "rgba(255,255,255,0.25)", cardBg: "rgba(18,34,64,0.6)", cardBorder: "rgba(255,107,26,0.12)", success: "#22C55E", error: "#FF4444" };
const CATS = { ENERGY: { color: "#FF8C42", bg: "rgba(255,140,66,0.12)", label: "Energy" }, CLIMATE: { color: "#4A9EFF", bg: "rgba(74,158,255,0.12)", label: "Climate" }, POVERTY: { color: "#22C55E", bg: "rgba(34,197,94,0.12)", label: "Poverty" }, ECONOMICS: { color: "#FFAA00", bg: "rgba(255,170,0,0.12)", label: "Economics" }, GEOPOLITICS: { color: "#A78BFA", bg: "rgba(167,139,250,0.12)", label: "Geopolitics" } };

const genCode = () => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r = ""; for (let i = 0; i < 5; i++) r += c[Math.floor(Math.random() * c.length)]; return r; };
const BOT_NAMES = ["Emma","Liam","Sofia","Noah","Olivia","Lucas","Mia","Ethan","Ava","James","Isabella","Alex","Charlotte","William","Amelia","Benjamin","Harper","Mason","Ella","Logan","Aria","Daniel","Scarlett","Henry","Grace"];

function generateBotAnswer(q) {
  if (q.type === "slider") {
    const avg = q.averageGuess || (q.correctAnswer * 0.5);
    return Math.max(q.min, Math.min(q.max, Math.round(avg + (Math.random() - 0.5) * 40)));
  }
  if (Math.random() < 0.12) return q.correctIndex;
  const wrong = q.options.map((_, i) => i).filter(i => i !== q.correctIndex);
  return wrong[Math.floor(Math.random() * wrong.length)];
}

const pageStyle = { minHeight: "100vh", background: T.bg, fontFamily: "'Outfit', sans-serif", position: "relative", overflow: "hidden", backgroundImage: "radial-gradient(ellipse at 50% 100%, rgba(255,107,26,0.08) 0%, transparent 50%), radial-gradient(ellipse at 20% 80%, rgba(255,69,0,0.05) 0%, transparent 40%), radial-gradient(ellipse at 80% 90%, rgba(255,170,0,0.04) 0%, transparent 40%)" };
const flameSvg = <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: 300, pointerEvents: "none", zIndex: 0 }}><svg width="100%" height="300" viewBox="0 0 800 300" preserveAspectRatio="none" style={{ opacity: 0.07 }}><ellipse cx="400" cy="280" rx="350" ry="120" fill="url(#f1)"/><ellipse cx="300" cy="260" rx="150" ry="100" fill="url(#f2)"/><ellipse cx="550" cy="250" rx="120" ry="90" fill="url(#f3)"/><defs><radialGradient id="f1"><stop stopColor="#FF6B1A"/><stop offset="1" stopColor="transparent"/></radialGradient><radialGradient id="f2"><stop stopColor="#FF4500"/><stop offset="1" stopColor="transparent"/></radialGradient><radialGradient id="f3"><stop stopColor="#FFAA00"/><stop offset="1" stopColor="transparent"/></radialGradient></defs></svg></div>;

function Btn({ children, onClick, variant = "primary", disabled, style: sx }) {
  const base = { border: "none", borderRadius: 12, padding: "14px 28px", fontSize: 16, fontWeight: 600, cursor: disabled ? "default" : "pointer", fontFamily: "'Outfit', sans-serif", transition: "all 0.3s", opacity: disabled ? 0.4 : 1 };
  const s = variant === "primary" ? { ...base, background: `linear-gradient(135deg, ${T.flame}, ${T.primary})`, color: "#fff", boxShadow: "0 4px 20px rgba(255,107,26,0.25)" } : { ...base, background: T.navyLight, color: "rgba(255,255,255,0.6)", border: "1px solid rgba(255,255,255,0.08)" };
  return <button onClick={onClick} disabled={disabled} style={{ ...s, ...sx }}>{children}</button>;
}

function AnimBar({ label, value, max, color, delay }) {
  const [w, setW] = useState(0);
  useEffect(() => { const t = setTimeout(() => setW((value / max) * 100), delay || 100); return () => clearTimeout(t); }, [value, max, delay]);
  return (<div style={{ marginBottom: 10 }}><div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }}><span style={{ color: T.textDim }}>{label}</span><span style={{ color, fontWeight: 700 }}>{value}%</span></div><div style={{ height: 8, borderRadius: 4, background: "rgba(255,255,255,0.05)", overflow: "hidden" }}><div style={{ height: "100%", borderRadius: 4, background: color, width: `${w}%`, transition: "width 1.2s cubic-bezier(0.16, 1, 0.3, 1)" }}/></div></div>);
}

function SliderInput({ min, max, unit, value, onChange, disabled }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ width: "100%", padding: "20px 0" }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}><div style={{ fontSize: 56, fontWeight: 800, fontFamily: "'Playfair Display', Georgia, serif", color: "#fff", textShadow: "0 0 40px rgba(255,107,26,0.4)" }}>{value}{unit}</div></div>
      <div style={{ position: "relative", height: 48, display: "flex", alignItems: "center" }}>
        <div style={{ position: "absolute", width: "100%", height: 6, borderRadius: 3, background: "rgba(255,255,255,0.06)" }} />
        <div style={{ position: "absolute", width: `${pct}%`, height: 6, borderRadius: 3, background: `linear-gradient(90deg, ${T.primary}, ${T.amber})`, transition: "width 0.1s" }} />
        <input type="range" min={min} max={max} value={value} onChange={e => onChange(+e.target.value)} disabled={disabled} style={{ position: "absolute", width: "100%", height: 48, opacity: 0, cursor: disabled ? "default" : "grab", zIndex: 2 }} />
        <div style={{ position: "absolute", left: `calc(${pct}% - 14px)`, width: 28, height: 28, borderRadius: "50%", background: T.primary, boxShadow: "0 0 20px rgba(255,107,26,0.6)", transition: "left 0.1s", pointerEvents: "none", border: "3px solid #fff" }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 13, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}><span>{min}{unit}</span><span>{max}{unit}</span></div>
    </div>
  );
}

function ChoiceInput({ options, selected, onSelect, disabled, correctIndex, revealed }) {
  return (
    <div style={{ display: "grid", gap: 12, width: "100%" }}>
      {options.map((opt, i) => {
        const isSel = selected === i, isCor = i === correctIndex;
        let bg = T.navyLight, border = "1px solid rgba(255,255,255,0.06)", tc = "rgba(255,255,255,0.7)";
        if (revealed && isCor) { bg = "rgba(34,197,94,0.15)"; border = "1px solid rgba(34,197,94,0.5)"; tc = T.success; }
        else if (revealed && isSel && !isCor) { bg = "rgba(255,68,68,0.1)"; border = "1px solid rgba(255,68,68,0.3)"; tc = T.error; }
        else if (isSel) { bg = "rgba(255,107,26,0.12)"; border = "1px solid rgba(255,107,26,0.4)"; tc = "#fff"; }
        return (
          <button key={i} onClick={() => !disabled && onSelect(i)} disabled={disabled} style={{ background: bg, border, borderRadius: 12, padding: "16px 20px", color: tc, fontSize: 16, fontFamily: "'Outfit', sans-serif", cursor: disabled ? "default" : "pointer", textAlign: "left", transition: "all 0.3s", display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0, fontFamily: "'JetBrains Mono', monospace", background: revealed && isCor ? "rgba(34,197,94,0.2)" : revealed && isSel ? "rgba(255,68,68,0.2)" : "rgba(255,255,255,0.05)", color: revealed && isCor ? T.success : revealed && isSel ? T.error : "rgba(255,255,255,0.35)" }}>
              {revealed && isCor ? "✓" : revealed && isSel && !isCor ? "✗" : String.fromCharCode(65 + i)}
            </span>{opt}
          </button>
        );
      })}
    </div>
  );
}

function ScoreRing({ score, total }) {
  const pct = Math.round((score / total) * 100), r = 58, circ = 2 * Math.PI * r;
  const [offset, setOffset] = useState(circ);
  useEffect(() => { setTimeout(() => setOffset(circ - (pct / 100) * circ), 300); }, [pct, circ]);
  let grade, gc, gl;
  if (pct >= 80) { grade = "A"; gc = T.success; gl = "Exceptionally informed"; }
  else if (pct >= 60) { grade = "B"; gc = "#4A9EFF"; gl = "Above average awareness"; }
  else if (pct >= 40) { grade = "C"; gc = T.amber; gl = "Average — room to grow"; }
  else if (pct >= 20) { grade = "D"; gc = T.primary; gl = "Below average — you're not alone"; }
  else { grade = "F"; gc = T.error; gl = "The world is very different from what you think"; }
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
      <div style={{ position: "relative", width: 140, height: 140 }}>
        <svg width="140" height="140" style={{ transform: "rotate(-90deg)" }}><circle cx="70" cy="70" r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/><circle cx="70" cy="70" r={r} fill="none" stroke={gc} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1)" }}/></svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}><div style={{ fontSize: 36, fontWeight: 800, color: gc, fontFamily: "'Playfair Display', Georgia, serif" }}>{grade}</div><div style={{ fontSize: 14, color: T.textDim, fontFamily: "'JetBrains Mono', monospace" }}>{score}/{total}</div></div>
      </div>
      <div style={{ fontSize: 15, color: "rgba(255,255,255,0.55)", textAlign: "center" }}>{gl}</div>
    </div>
  );
}

function DistributionChart({ answers, correctAnswer, type, options, unit }) {
  if (type === "slider") {
    const buckets = Array(10).fill(0), vals = Object.values(answers);
    vals.forEach(v => { buckets[Math.min(Math.floor(v / 10), 9)]++; });
    const maxB = Math.max(...buckets, 1), cb = Math.min(Math.floor(correctAnswer / 10), 9);
    return (
      <div>
        <div style={{ fontSize: 12, letterSpacing: 3, color: T.textFaint, marginBottom: 12, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase" }}>Classroom Distribution ({vals.length} responses)</div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 140, marginBottom: 4 }}>
          {buckets.map((b, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", height: "100%", justifyContent: "flex-end" }}>
              {b > 0 && <div style={{ fontSize: 12, color: i === cb ? T.success : T.primaryLight, fontFamily: "'JetBrains Mono', monospace", marginBottom: 4, fontWeight: 700 }}>{b}</div>}
              <div style={{ width: "100%", borderRadius: "4px 4px 0 0", transition: "height 1s cubic-bezier(0.16,1,0.3,1)", height: `${(b / maxB) * 90}%`, minHeight: b > 0 ? 4 : 0, background: i === cb ? `linear-gradient(180deg, ${T.success}, rgba(34,197,94,0.4))` : `linear-gradient(180deg, ${T.primary}, rgba(255,107,26,0.3))`, boxShadow: i === cb ? "0 0 15px rgba(34,197,94,0.3)" : b > 0 ? "0 0 10px rgba(255,107,26,0.15)" : "none" }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 4 }}>{buckets.map((_, i) => <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>{i * 10}</div>)}</div>
        <div style={{ display: "flex", justifyContent: "center", marginTop: 12, gap: 16, fontSize: 12 }}><span style={{ color: T.primary }}>■ Guesses</span><span style={{ color: T.success }}>■ Correct: {correctAnswer}{unit}</span></div>
      </div>
    );
  }
  const counts = Array(options.length).fill(0), vals = Object.values(answers);
  vals.forEach(v => { if (v >= 0 && v < options.length) counts[v]++; });
  return (
    <div>
      <div style={{ fontSize: 12, letterSpacing: 3, color: T.textFaint, marginBottom: 12, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase" }}>Classroom Responses ({vals.length} players)</div>
      <div style={{ display: "grid", gap: 8 }}>
        {options.map((opt, i) => {
          const isCor = i === correctAnswer, pct = vals.length > 0 ? Math.round((counts[i] / vals.length) * 100) : 0;
          return (
            <div key={i} style={{ position: "relative", borderRadius: 10, overflow: "hidden", background: T.navyLight, border: isCor ? `2px solid ${T.success}` : "2px solid transparent" }}>
              <div style={{ position: "absolute", top: 0, left: 0, bottom: 0, borderRadius: 8, width: `${pct}%`, transition: "width 1.2s cubic-bezier(0.16,1,0.3,1)", background: isCor ? "rgba(34,197,94,0.15)" : "rgba(255,107,26,0.08)" }} />
              <div style={{ position: "relative", padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ width: 26, height: 26, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", background: isCor ? "rgba(34,197,94,0.2)" : "rgba(255,255,255,0.05)", color: isCor ? T.success : "rgba(255,255,255,0.35)" }}>{isCor ? "✓" : String.fromCharCode(65 + i)}</span>
                  <span style={{ fontSize: 14, color: isCor ? T.success : "rgba(255,255,255,0.6)", fontWeight: isCor ? 600 : 400 }}>{opt}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 20, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace", color: isCor ? T.success : T.primaryLight }}>{pct}%</span>
                  <span style={{ fontSize: 11, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>({counts[i]})</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PlayerCount({ count }) {
  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "6px 14px", borderRadius: 20, background: "rgba(34,197,94,0.1)", border: "1px solid rgba(34,197,94,0.2)" }}>
      <div style={{ width: 8, height: 8, borderRadius: "50%", background: T.success, boxShadow: "0 0 8px rgba(34,197,94,0.5)" }} />
      <span style={{ fontSize: 13, color: T.success, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{count} player{count !== 1 ? "s" : ""}</span>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [soloQ, setSoloQ] = useState(0);
  const [soloAnswers, setSoloAnswers] = useState({});
  const [soloScore, setSoloScore] = useState(0);
  const [soloRevealed, setSoloRevealed] = useState(false);
  const [soloAnim, setSoloAnim] = useState(true);
  const [sliderVal, setSliderVal] = useState(50);
  const [choiceVal, setChoiceVal] = useState(null);
  const [room, setRoom] = useState(null);
  const botTimersRef = useRef([]);
  const total = QUESTIONS.length;

  useEffect(() => { return () => botTimersRef.current.forEach(clearTimeout); }, []);

  const soloReset = (idx) => {
    const nq = QUESTIONS[idx]; setSoloAnim(false);
    setTimeout(() => { setSoloQ(idx); setSoloRevealed(false); setChoiceVal(null); if (nq.type === "slider") setSliderVal(Math.round((nq.min + nq.max) / 2)); setSoloAnim(true); }, 300);
  };
  const soloSubmit = () => {
    setSoloRevealed(true); const q = QUESTIONS[soloQ]; let pts = 0;
    if (q.type === "slider") { const d = Math.abs(sliderVal - q.correctAnswer); if (d <= 5) pts = 3; else if (d <= 15) pts = 2; else if (d <= 25) pts = 1; }
    else if (choiceVal === q.correctIndex) pts = 3;
    setSoloScore(s => s + pts); setSoloAnswers(a => ({ ...a, [q.id]: pts }));
  };
  const soloNext = () => { if (soloQ < total - 1) soloReset(soloQ + 1); else setScreen("solo-results"); };
  const soloRestart = () => { setSoloScore(0); setSoloAnswers({}); soloReset(0); setScreen("solo"); };

  const createRoom = () => {
    botTimersRef.current.forEach(clearTimeout); botTimersRef.current = [];
    const code = genCode();
    const shuffled = [...BOT_NAMES].sort(() => Math.random() - 0.5);
    const botCount = 18 + Math.floor(Math.random() * 15);
    const players = {};
    for (let i = 0; i < botCount; i++) players[`bot-${i}`] = { name: shuffled[i % shuffled.length] };
    setRoom({ code, phase: "lobby", currentQ: 0, players, answers: {}, revealed: false });
    setScreen("host-lobby");
  };

  const startBotAnswers = (qIdx) => {
    botTimersRef.current.forEach(clearTimeout); botTimersRef.current = [];
    const q = QUESTIONS[qIdx];
    setRoom(prev => {
      const bots = Object.keys(prev.players);
      const shuffled = [...bots].sort(() => Math.random() - 0.5);
      let delay = 300;
      shuffled.forEach((botId) => {
        const d = delay + Math.random() * 350;
        delay = d;
        const tid = setTimeout(() => {
          setRoom(p => {
            const na = { ...p.answers };
            na[q.id] = { ...(na[q.id] || {}), [botId]: generateBotAnswer(q) };
            return { ...p, answers: na };
          });
        }, d);
        botTimersRef.current.push(tid);
      });
      return prev;
    });
  };

  const hostAdvance = (action) => {
    botTimersRef.current.forEach(clearTimeout); botTimersRef.current = [];
    if (action === "start") {
      setRoom(prev => ({ ...prev, phase: "question", currentQ: 0, revealed: false }));
      setScreen("host-game");
      setTimeout(() => startBotAnswers(0), 200);
    } else if (action === "reveal") {
      setRoom(prev => ({ ...prev, revealed: true }));
    } else if (action === "next") {
      setRoom(prev => {
        if (prev.currentQ < total - 1) {
          const nextQ = prev.currentQ + 1;
          setTimeout(() => startBotAnswers(nextQ), 200);
          return { ...prev, currentQ: nextQ, revealed: false };
        }
        return { ...prev, phase: "finished" };
      });
    }
  };

  if (screen === "home") {
    return (
      <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
        {flameSvg}
        <div style={{ textAlign: "center", maxWidth: 560, position: "relative", zIndex: 1 }}>
          <div style={{ fontSize: 11, letterSpacing: 6, color: T.primary, marginBottom: 28, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase", opacity: 0.8 }}>How well do you understand</div>
          <h1 style={{ fontSize: "clamp(44px, 9vw, 76px)", fontWeight: 800, color: "#fff", fontFamily: "'Playfair Display', Georgia, serif", lineHeight: 1.05, margin: "0 0 8px", textShadow: "0 2px 40px rgba(255,107,26,0.15)" }}>Understand</h1>
          <h1 style={{ fontSize: "clamp(44px, 9vw, 76px)", fontWeight: 700, fontFamily: "'Playfair Display', Georgia, serif", lineHeight: 1.05, margin: "0 0 12px", background: `linear-gradient(135deg, ${T.primary}, ${T.amber}, ${T.flame})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", filter: "drop-shadow(0 0 30px rgba(255,107,26,0.3))" }}><em>Energy</em></h1>
          <div style={{ width: 60, height: 3, margin: "24px auto", background: `linear-gradient(90deg, transparent, ${T.primary}, transparent)`, borderRadius: 2 }} />
          <p style={{ fontSize: 17, color: "rgba(255,255,255,0.4)", lineHeight: 1.7, margin: "24px auto 20px", maxWidth: 440, fontWeight: 300 }}>Most people score worse than random guessing on basic questions about energy, climate, poverty, and economics.</p>
          <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", marginBottom: 40 }}>
            {Object.values(CATS).map(c => <span key={c.label} style={{ padding: "6px 14px", borderRadius: 20, fontSize: 12, background: c.bg, color: c.color, border: `1px solid ${c.color}20`, fontFamily: "'JetBrains Mono', monospace", fontWeight: 500 }}>{c.label}</span>)}
          </div>
          <button onClick={() => { soloReset(0); setSoloScore(0); setSoloAnswers({}); setScreen("solo"); }}
            style={{ background: `linear-gradient(135deg, ${T.flame}, ${T.primary}, ${T.amber})`, border: "none", borderRadius: 14, padding: "20px 56px", color: "#fff", fontSize: 19, fontWeight: 700, cursor: "pointer", fontFamily: "'Outfit', sans-serif", boxShadow: "0 4px 30px rgba(255,107,26,0.3), 0 0 60px rgba(255,69,0,0.15)", transition: "transform 0.2s", display: "block", margin: "0 auto" }}>
            Test Your Knowledge →
          </button>
          <div style={{ marginTop: 12, fontSize: 13, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>{total} questions · ~5 minutes</div>
          <div style={{ marginTop: 48, padding: "20px 24px", borderRadius: 14, background: "rgba(255,107,26,0.03)", border: "1px solid rgba(255,107,26,0.08)" }}>
            <div style={{ fontSize: 12, letterSpacing: 3, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase", marginBottom: 12 }}>Classroom Mode</div>
            <p style={{ fontSize: 14, color: "rgba(255,255,255,0.35)", margin: "0 0 16px", lineHeight: 1.6 }}>Run a live session with an audience. See the room's misconceptions revealed in real-time.</p>
            <button onClick={createRoom} style={{ background: T.navyMid, border: "1px solid rgba(255,107,26,0.2)", borderRadius: 10, padding: "10px 20px", color: T.primaryLight, fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "'Outfit', sans-serif" }}>🎤 Try Classroom Demo</button>
          </div>
        </div>
      </div>
    );
  }

  if (screen === "solo") {
    const q = QUESTIONS[soloQ], cat = CATS[q.category], canSub = q.type === "choice" ? choiceVal !== null : true;
    return (
      <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", padding: "32px 24px 48px" }}>
        {flameSvg}
        <div style={{ maxWidth: 520, width: "100%", marginBottom: 32, position: "relative", zIndex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <span style={{ padding: "5px 14px", borderRadius: 20, fontSize: 12, background: cat.bg, color: cat.color, border: `1px solid ${cat.color}20`, fontFamily: "'JetBrains Mono', monospace" }}>{cat.label}</span>
            <span style={{ fontSize: 13, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>{soloQ + 1} / {total}</span>
          </div>
          <div style={{ height: 3, borderRadius: 2, background: "rgba(255,255,255,0.05)", overflow: "hidden" }}><div style={{ height: "100%", background: `linear-gradient(90deg, ${T.flame}, ${T.primary}, ${T.amber})`, width: `${((soloQ + (soloRevealed ? 1 : 0)) / total) * 100}%`, transition: "width 0.6s" }} /></div>
        </div>
        <div style={{ maxWidth: 520, width: "100%", position: "relative", zIndex: 1, opacity: soloAnim ? 1 : 0, transform: soloAnim ? "translateY(0)" : "translateY(20px)", transition: "opacity 0.4s, transform 0.4s" }}>
          <div style={{ fontSize: 36, marginBottom: 16, textAlign: "center" }}>{q.icon}</div>
          <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(22px, 4vw, 28px)", color: "#fff", fontWeight: 400, textAlign: "center", lineHeight: 1.4, margin: "0 0 32px" }}>{q.question}</h2>
          {q.type === "slider" && <SliderInput min={q.min} max={q.max} unit={q.unit} value={sliderVal} onChange={setSliderVal} disabled={soloRevealed} />}
          {q.type === "choice" && <ChoiceInput options={q.options} selected={choiceVal} onSelect={setChoiceVal} disabled={soloRevealed} correctIndex={q.correctIndex} revealed={soloRevealed} />}
          {!soloRevealed ? (
            <Btn onClick={soloSubmit} disabled={!canSub} style={{ width: "100%", marginTop: 24, padding: "16px" }}>Lock In Answer</Btn>
          ) : (
            <div style={{ marginTop: 32, padding: 24, borderRadius: 16, background: T.cardBg, border: `1px solid ${T.cardBorder}` }}>
              {q.type === "slider" && <div style={{ marginBottom: 20 }}><AnimBar label="Your guess" value={sliderVal} max={q.max} color={T.error} delay={200} /><AnimBar label="Average guess" value={q.averageGuess} max={q.max} color="rgba(255,255,255,0.2)" delay={400} /><AnimBar label="Reality" value={q.correctAnswer} max={q.max} color={T.success} delay={600} /></div>}
              <p style={{ fontSize: 15, color: "rgba(255,255,255,0.65)", lineHeight: 1.7, margin: "0 0 16px", fontWeight: 300 }}>{q.explanation}</p>
              <div style={{ padding: "12px 16px", borderRadius: 8, marginBottom: 16, background: "rgba(255,107,26,0.06)", borderLeft: `3px solid ${T.primary}` }}><div style={{ fontSize: 14, color: T.primaryLight, lineHeight: 1.6, fontWeight: 500 }}>💡 {q.insight}</div></div>
              <div style={{ fontSize: 12, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>Source: {q.source}</div>
              <Btn onClick={soloNext} style={{ width: "100%", marginTop: 20, padding: "16px" }}>{soloQ < total - 1 ? "Next Question →" : "See Your Results →"}</Btn>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "center", marginTop: 24, gap: 6 }}>
            {QUESTIONS.map((_, i) => <div key={i} style={{ width: i === soloQ ? 24 : 8, height: 8, borderRadius: 4, background: soloAnswers[QUESTIONS[i].id] !== undefined ? soloAnswers[QUESTIONS[i].id] >= 2 ? T.success : soloAnswers[QUESTIONS[i].id] >= 1 ? T.amber : T.error : i === soloQ ? T.primary : "rgba(255,255,255,0.06)", transition: "all 0.3s", boxShadow: i === soloQ ? "0 0 8px rgba(255,107,26,0.4)" : "none" }} />)}
          </div>
        </div>
      </div>
    );
  }

  if (screen === "solo-results") {
    const maxScore = total * 3, cats = {};
    QUESTIONS.forEach(q => { if (!cats[q.category]) cats[q.category] = { c: 0, t: 0 }; cats[q.category].t += 3; cats[q.category].c += soloAnswers[q.id] || 0; });
    return (
      <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", padding: "48px 24px" }}>
        {flameSvg}
        <div style={{ maxWidth: 480, width: "100%", textAlign: "center", position: "relative", zIndex: 1 }}>
          <div style={{ fontSize: 11, letterSpacing: 6, color: T.primary, marginBottom: 12, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase" }}>Your Results</div>
          <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 34, color: "#fff", fontWeight: 400, margin: "0 0 40px" }}>How well do you<br/><em style={{ background: `linear-gradient(135deg, ${T.primary}, ${T.amber})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>understand energy?</em></h2>
          <ScoreRing score={soloScore} total={maxScore} />
          <div style={{ marginTop: 40, textAlign: "left" }}>
            <div style={{ fontSize: 11, letterSpacing: 4, color: T.textFaint, marginBottom: 16, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase" }}>By Category</div>
            {Object.entries(cats).map(([k, v]) => <AnimBar key={k} label={CATS[k].label} value={Math.round((v.c / v.t) * 100)} max={100} color={CATS[k].color} delay={300} />)}
          </div>
          <div style={{ marginTop: 32, padding: 20, borderRadius: 12, background: "rgba(255,107,26,0.03)", border: "1px solid rgba(255,107,26,0.1)", textAlign: "left" }}>
            <div style={{ fontSize: 14, color: "rgba(255,255,255,0.5)", lineHeight: 1.7, fontWeight: 300 }}>Don't worry — most people score poorly. <strong style={{ color: T.primary, fontWeight: 600 }}>Understanding energy starts with discovering what you got wrong.</strong></div>
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 32, justifyContent: "center" }}><Btn onClick={soloRestart}>Play Again</Btn><Btn variant="secondary" onClick={() => setScreen("home")}>Home</Btn></div>
        </div>
      </div>
    );
  }

  if (screen === "host-lobby" && room) {
    const pc = Object.keys(room.players).length;
    return (
      <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
        {flameSvg}
        <div style={{ maxWidth: 600, width: "100%", textAlign: "center", position: "relative", zIndex: 1 }}>
          <div style={{ display: "inline-block", padding: "6px 16px", borderRadius: 20, background: "rgba(167,139,250,0.1)", border: "1px solid rgba(167,139,250,0.2)", marginBottom: 16 }}>
            <span style={{ fontSize: 12, color: "#A78BFA", fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>🧪 DEMO MODE — {pc} simulated students</span>
          </div>
          <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 34, color: "#fff", margin: "0 0 32px" }}>Understand <em style={{ color: T.primary }}>Energy</em></h2>
          <div style={{ padding: 32, borderRadius: 20, background: T.cardBg, border: `1px solid ${T.cardBorder}`, marginBottom: 32 }}>
            <div style={{ fontSize: 13, color: T.textDim, marginBottom: 12, fontFamily: "'JetBrains Mono', monospace" }}>Room code:</div>
            <div style={{ fontSize: 72, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace", color: "#fff", letterSpacing: 12, textShadow: "0 0 40px rgba(255,107,26,0.4)" }}>{room.code}</div>
            <div style={{ marginTop: 20 }}><PlayerCount count={pc} /></div>
            <div style={{ marginTop: 16, display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center" }}>
              {Object.values(room.players).slice(0, 20).map((p, i) => <span key={i} style={{ padding: "3px 10px", borderRadius: 12, background: "rgba(255,255,255,0.05)", color: T.textDim, fontSize: 12 }}>{p.name}</span>)}
              {pc > 20 && <span style={{ padding: "3px 10px", borderRadius: 12, background: "rgba(255,255,255,0.05)", color: T.textFaint, fontSize: 12 }}>+{pc - 20} more</span>}
            </div>
          </div>
          <Btn onClick={() => hostAdvance("start")} style={{ padding: "18px 48px", fontSize: 18 }}>Start Quiz →</Btn>
          <div style={{ marginTop: 16 }}><button onClick={() => setScreen("home")} style={{ background: "none", border: "none", color: T.textDim, cursor: "pointer", fontSize: 14 }}>← Back</button></div>
        </div>
      </div>
    );
  }

  if (screen === "host-game" && room) {
    if (room.phase === "finished") {
      return (
        <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          {flameSvg}
          <div style={{ maxWidth: 560, width: "100%", textAlign: "center", position: "relative", zIndex: 1 }}>
            <div style={{ fontSize: 64, marginBottom: 16 }}>🎓</div>
            <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: 38, color: "#fff", margin: "0 0 16px" }}>Session <em style={{ color: T.primary }}>Complete</em></h2>
            <p style={{ color: T.textDim, fontSize: 16, lineHeight: 1.7, margin: "0 0 32px" }}>{Object.keys(room.players).length} participants completed {total} questions.</p>
            <div style={{ display: "flex", gap: 12, justifyContent: "center" }}><Btn onClick={createRoom}>New Session</Btn><Btn variant="secondary" onClick={() => setScreen("home")}>Home</Btn></div>
          </div>
        </div>
      );
    }

    const q = QUESTIONS[room.currentQ], cat = CATS[q.category];
    const pc = Object.keys(room.players).length;
    const qa = room.answers?.[q.id] || {}, ac = Object.keys(qa).length;
    const allIn = ac >= pc;

    return (
      <div style={{ ...pageStyle, display: "flex", flexDirection: "column", alignItems: "center", padding: "32px 24px" }}>
        {flameSvg}
        <div style={{ maxWidth: 700, width: "100%", position: "relative", zIndex: 1 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 8 }}>
            <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
              <span style={{ padding: "5px 14px", borderRadius: 20, fontSize: 12, background: cat.bg, color: cat.color, fontFamily: "'JetBrains Mono', monospace" }}>{cat.label}</span>
              <span style={{ fontSize: 13, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace" }}>Q{room.currentQ + 1}/{total}</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
              <PlayerCount count={pc} />
              <div style={{ padding: "6px 14px", borderRadius: 20, background: allIn ? "rgba(34,197,94,0.1)" : "rgba(255,107,26,0.1)", border: allIn ? "1px solid rgba(34,197,94,0.2)" : "1px solid rgba(255,107,26,0.2)", transition: "all 0.3s" }}>
                <span style={{ fontSize: 13, color: allIn ? T.success : T.primary, fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, transition: "color 0.3s" }}>{ac}/{pc} answered</span>
              </div>
            </div>
          </div>
          <div style={{ height: 4, borderRadius: 2, background: "rgba(255,255,255,0.05)", overflow: "hidden", marginBottom: 32 }}><div style={{ height: "100%", background: `linear-gradient(90deg, ${T.flame}, ${T.primary}, ${T.amber})`, width: `${((room.currentQ + (room.revealed ? 1 : 0)) / total) * 100}%`, transition: "width 0.6s" }} /></div>
          <div style={{ textAlign: "center", marginBottom: 32 }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>{q.icon}</div>
            <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(26px, 4vw, 36px)", color: "#fff", fontWeight: 400, lineHeight: 1.35, margin: 0 }}>{q.question}</h2>
          </div>
          {!room.revealed ? (
            <div style={{ textAlign: "center" }}>
              <div style={{ padding: 32, borderRadius: 16, background: T.cardBg, border: `1px solid ${T.cardBorder}`, marginBottom: 24 }}>
                <div style={{ fontSize: 48, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace", color: allIn ? T.success : T.primary, marginBottom: 8, transition: "color 0.3s" }}>{ac}/{pc}</div>
                <div style={{ color: T.textDim, fontSize: 14 }}>{allIn ? "All responses in!" : "responses received"}</div>
                <div style={{ display: "flex", justifyContent: "center", gap: 4, marginTop: 20, flexWrap: "wrap", maxWidth: 400, margin: "20px auto 0" }}>
                  {Array.from({ length: Math.min(pc, 50) }).map((_, i) => <div key={i} style={{ width: 10, height: 10, borderRadius: "50%", background: i < ac ? T.success : "rgba(255,255,255,0.06)", boxShadow: i < ac ? "0 0 6px rgba(34,197,94,0.3)" : "none", transition: "all 0.3s" }} />)}
                </div>
              </div>
              <Btn onClick={() => hostAdvance("reveal")} disabled={ac < 1} style={{ padding: "16px 48px", fontSize: 18 }}>🔓 Reveal Results</Btn>
            </div>
          ) : (
            <div>
              <div style={{ padding: 28, borderRadius: 16, background: T.cardBg, border: `1px solid ${T.cardBorder}`, marginBottom: 24 }}>
                <DistributionChart answers={qa} correctAnswer={q.type === "slider" ? q.correctAnswer : q.correctIndex} type={q.type} options={q.options} unit={q.unit} />
              </div>
              <div style={{ padding: 24, borderRadius: 16, background: T.cardBg, border: `1px solid ${T.cardBorder}`, marginBottom: 24 }}>
                <p style={{ fontSize: 16, color: "rgba(255,255,255,0.65)", lineHeight: 1.7, margin: "0 0 16px", fontWeight: 300 }}>{q.explanation}</p>
                <div style={{ padding: "12px 16px", borderRadius: 8, background: "rgba(255,107,26,0.06)", borderLeft: `3px solid ${T.primary}` }}><div style={{ fontSize: 15, color: T.primaryLight, lineHeight: 1.6, fontWeight: 500 }}>💡 {q.insight}</div></div>
                <div style={{ fontSize: 12, color: T.textFaint, fontFamily: "'JetBrains Mono', monospace", marginTop: 12 }}>Source: {q.source}</div>
              </div>
              <div style={{ textAlign: "center" }}><Btn onClick={() => hostAdvance("next")} style={{ padding: "16px 48px", fontSize: 18 }}>{room.currentQ < total - 1 ? "Next Question →" : "Finish Session →"}</Btn></div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

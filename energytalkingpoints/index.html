const flameSvg=<div style={{position:"absolute",bottom:0,left:0,right:0,height:300,pointerEvents:"none",zIndex:0}}><svg width="100%" height="300" viewBox="0 0 800 300" preserveAspectRatio="none" style={{opacity:0.07}}><ellipse cx="400" cy="280" rx="350" ry="120" fill="url(#f1)"/><ellipse cx="300" cy="260" rx="150" ry="100" fill="url(#f2)"/><ellipse cx="550" cy="250" rx="120" ry="90" fill="url(#f3)"/><defs><radialGradient id="f1"><stop stopColor="#FF6B1A"/><stop offset="1" stopColor="transparent"/></radialGradient><radialGradient id="f2"><stop stopColor="#FF4500"/><stop offset="1" stopColor="transparent"/></radialGradient><radialGradient id="f3"><stop stopColor="#FFAA00"/><stop offset="1" stopColor="transparent"/></radialGradient></defs></svg></div>;
const inputStyle={width:"100%",padding:"16px 20px",borderRadius:12,border:"1px solid rgba(255,255,255,0.08)",background:T.navyLight,color:"#fff",fontSize:16,outline:"none",textAlign:"center"};

function Btn({children,onClick,variant="primary",disabled,style:sx}){
  const base={border:"none",borderRadius:12,padding:"14px 28px",fontSize:16,fontWeight:600,cursor:disabled?"default":"pointer",fontFamily:"'Outfit', sans-serif",transition:"all 0.3s",opacity:disabled?0.4:1};
  const s=variant==="primary"?{...base,background:`linear-gradient(135deg, ${T.flame}, ${T.primary})`,color:"#fff",boxShadow:"0 4px 20px rgba(255,107,26,0.25)"}:{...base,background:T.navyLight,color:"rgba(255,255,255,0.6)",border:"1px solid rgba(255,255,255,0.08)"};
  return <button onClick={onClick} disabled={disabled} style={{...s,...sx}}>{children}</button>;
}

function AnimBar({label,value,max,color,delay}){
  const[w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW((value/max)*100),delay||100);return()=>clearTimeout(t);},[value,max,delay]);
  return(<div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13,fontFamily:"'JetBrains Mono', monospace"}}><span style={{color:T.textDim}}>{label}</span><span style={{color,fontWeight:700}}>{value}%</span></div><div style={{height:8,borderRadius:4,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,background:color,width:`${w}%`,transition:"width 1.2s cubic-bezier(0.16, 1, 0.3, 1)"}}/></div></div>);
}

function SliderInput({min,max,unit,value,onChange,disabled}){
  const pct=((value-min)/(max-min))*100;
  return(
    <div style={{width:"100%",padding:"20px 0"}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><div style={{fontSize:56,fontWeight:800,fontFamily:"'Playfair Display', Georgia, serif",color:"#fff",textShadow:"0 0 40px rgba(255,107,26,0.4)"}}>{value}{unit}</div></div>
      <div style={{position:"relative",height:48,display:"flex",alignItems:"center"}}>
        <div style={{position:"absolute",width:"100%",height:6,borderRadius:3,background:"rgba(255,255,255,0.06)"}}/>
        <div style={{position:"absolute",width:`${pct}%`,height:6,borderRadius:3,background:`linear-gradient(90deg, ${T.primary}, ${T.amber})`,transition:"width 0.1s"}}/>
        <input type="range" min={min} max={max} value={value} onChange={e=>onChange(+e.target.value)} disabled={disabled} style={{position:"absolute",width:"100%",height:48,opacity:0,cursor:disabled?"default":"grab",zIndex:2}}/>
        <div style={{position:"absolute",left:`calc(${pct}% - 14px)`,width:28,height:28,borderRadius:"50%",background:T.primary,boxShadow:"0 0 20px rgba(255,107,26,0.6)",transition:"left 0.1s",pointerEvents:"none",border:"3px solid #fff"}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}><span>{min}{unit}</span><span>{max}{unit}</span></div>
    </div>
  );
}

function ChoiceInput({options,selected,onSelect,disabled,correctIndex,revealed}){
  return(
    <div style={{display:"grid",gap:12,width:"100%"}}>
      {options.map((opt,i)=>{
        const isSel=selected===i,isCor=i===correctIndex;
        let bg=T.navyLight,border="1px solid rgba(255,255,255,0.06)",tc="rgba(255,255,255,0.7)";
        if(revealed&&isCor){bg="rgba(34,197,94,0.15)";border="1px solid rgba(34,197,94,0.5)";tc=T.success;}
        else if(revealed&&isSel&&!isCor){bg="rgba(255,68,68,0.1)";border="1px solid rgba(255,68,68,0.3)";tc=T.error;}
        else if(isSel){bg="rgba(255,107,26,0.12)";border="1px solid rgba(255,107,26,0.4)";tc="#fff";}
        return(
          <button key={i} onClick={()=>!disabled&&onSelect(i)} disabled={disabled} style={{background:bg,border,borderRadius:12,padding:"16px 20px",color:tc,fontSize:16,fontFamily:"'Outfit', sans-serif",cursor:disabled?"default":"pointer",textAlign:"left",transition:"all 0.3s",display:"flex",alignItems:"center",gap:12}}>
            <span style={{width:30,height:30,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0,fontFamily:"'JetBrains Mono', monospace",background:revealed&&isCor?"rgba(34,197,94,0.2)":revealed&&isSel?"rgba(255,68,68,0.2)":"rgba(255,255,255,0.05)",color:revealed&&isCor?T.success:revealed&&isSel?T.error:"rgba(255,255,255,0.35)"}}>
              {revealed&&isCor?"✓":revealed&&isSel&&!isCor?"✗":String.fromCharCode(65+i)}
            </span>{opt}
          </button>
        );
      })}
    </div>
  );
}

function ScoreRing({score,total}){
  const pct=Math.round((score/total)*100),r=58,circ=2*Math.PI*r;
  const[offset,setOffset]=useState(circ);
  useEffect(()=>{setTimeout(()=>setOffset(circ-(pct/100)*circ),300);},[pct,circ]);
  let grade,gc,gl;
  if(pct>=80){grade="A";gc=T.success;gl="Exceptionally informed";}
  else if(pct>=60){grade="B";gc="#4A9EFF";gl="Above average awareness";}
  else if(pct>=40){grade="C";gc=T.amber;gl="Average — room to grow";}
  else if(pct>=20){grade="D";gc=T.primary;gl="Below average — you're not alone";}
  else{grade="F";gc=T.error;gl="Energy is very different from what you think";}
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
      <div style={{position:"relative",width:140,height:140}}>
        <svg width="140" height="140" style={{transform:"rotate(-90deg)"}}><circle cx="70" cy="70" r={r} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/><circle cx="70" cy="70" r={r} fill="none" stroke={gc} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1)"}}/></svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><div style={{fontSize:36,fontWeight:800,color:gc,fontFamily:"'Playfair Display', Georgia, serif"}}>{grade}</div><div style={{fontSize:14,color:T.textDim,fontFamily:"'JetBrains Mono', monospace"}}>{score}/{total}</div></div>
      </div>
      <div style={{fontSize:15,color:"rgba(255,255,255,0.55)",textAlign:"center"}}>{gl}</div>
    </div>
  );
}

function DistributionChart({answers,correctAnswer,type,options,unit}){
  if(type==="slider"){
    const buckets=Array(10).fill(0),vals=Object.values(answers||{});
    vals.forEach(v=>{buckets[Math.min(Math.floor(v/10),9)]++;});
    const maxB=Math.max(...buckets,1),cb=Math.min(Math.floor(correctAnswer/10),9);
    return(
      <div>
        <div style={{fontSize:12,letterSpacing:3,color:T.textFaint,marginBottom:12,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase"}}>Audience Distribution ({vals.length} responses)</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:4,height:140,marginBottom:4}}>
          {buckets.map((b,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",height:"100%",justifyContent:"flex-end"}}>
              {b>0&&<div style={{fontSize:12,color:i===cb?T.success:T.primaryLight,fontFamily:"'JetBrains Mono', monospace",marginBottom:4,fontWeight:700}}>{b}</div>}
              <div style={{width:"100%",borderRadius:"4px 4px 0 0",transition:"height 1s cubic-bezier(0.16,1,0.3,1)",height:`${(b/maxB)*90}%`,minHeight:b>0?4:0,background:i===cb?`linear-gradient(180deg, ${T.success}, rgba(34,197,94,0.4))`:`linear-gradient(180deg, ${T.primary}, rgba(255,107,26,0.3))`,boxShadow:i===cb?"0 0 15px rgba(34,197,94,0.3)":b>0?"0 0 10px rgba(255,107,26,0.15)":"none"}}/>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:4}}>{buckets.map((_,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:10,color:i===cb?T.success:T.textFaint,fontFamily:"'JetBrains Mono', monospace",fontWeight:i===cb?700:400}}>{i*10}</div>)}</div>
        <div style={{textAlign:"center",marginTop:16}}><div style={{padding:"10px 16px",borderRadius:8,background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.2)",display:"inline-block"}}><span style={{fontSize:13,color:T.success,fontFamily:"'JetBrains Mono', monospace",fontWeight:700}}>✓ Correct answer: {correctAnswer}{unit}</span></div></div>
        <div style={{display:"flex",justifyContent:"center",marginTop:8,gap:16,fontSize:12}}><span style={{color:T.primary}}>■ Audience guesses</span></div>
      </div>
    );
  }
  const counts=Array(options.length).fill(0),vals=Object.values(answers||{});
  vals.forEach(v=>{if(v>=0&&v<options.length)counts[v]++;});
  return(
    <div>
      <div style={{fontSize:12,letterSpacing:3,color:T.textFaint,marginBottom:12,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase"}}>Audience Responses ({vals.length} players)</div>
      <div style={{display:"grid",gap:8}}>
        {options.map((opt,i)=>{
          const isCor=i===correctAnswer,pct=vals.length>0?Math.round((counts[i]/vals.length)*100):0;
          return(
            <div key={i} style={{position:"relative",borderRadius:10,overflow:"hidden",background:isCor?"rgba(34,197,94,0.08)":T.navyLight,border:isCor?`2px solid ${T.success}`:"2px solid transparent",opacity:isCor?1:0.7}}>
              <div style={{position:"absolute",top:0,left:0,bottom:0,borderRadius:8,width:`${pct}%`,transition:"width 1.2s cubic-bezier(0.16,1,0.3,1)",background:isCor?"rgba(34,197,94,0.2)":"rgba(255,107,26,0.08)"}}/>
              <div style={{position:"relative",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{width:isCor?30:26,height:isCor?30:26,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:isCor?16:12,fontWeight:700,fontFamily:"'JetBrains Mono', monospace",background:isCor?"rgba(34,197,94,0.3)":"rgba(255,255,255,0.05)",color:isCor?T.success:"rgba(255,255,255,0.35)"}}>{isCor?"✓":String.fromCharCode(65+i)}</span>
                  <div>
                    <span style={{fontSize:isCor?15:14,color:isCor?T.success:"rgba(255,255,255,0.5)",fontWeight:isCor?700:400}}>{opt}</span>
                    {isCor&&<div style={{fontSize:10,letterSpacing:2,color:T.success,fontFamily:"'JetBrains Mono', monospace",fontWeight:700,marginTop:2}}>CORRECT ANSWER</div>}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:isCor?24:18,fontWeight:800,fontFamily:"'JetBrains Mono', monospace",color:isCor?T.success:T.primaryLight}}>{pct}%</span>
                  <span style={{fontSize:11,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>({counts[i]})</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const[soloQ,setSoloQ]=useState(0);
  const[soloAnswers,setSoloAnswers]=useState({});
  const[soloScore,setSoloScore]=useState(0);
  const[soloRevealed,setSoloRevealed]=useState(false);
  const[soloAnim,setSoloAnim]=useState(true);
  const[sliderVal,setSliderVal]=useState(50);
  const[choiceVal,setChoiceVal]=useState(null);
  const[roomCode,setRoomCode]=useState("");
  const[roomData,setRoomData]=useState(null);
  const[playerName,setPlayerName]=useState("");
  const[joinCode,setJoinCode]=useState(URL_JOIN_CODE||"");
  const[playerAnswer,setPlayerAnswer]=useState(null);
  const[playerSlider,setPlayerSlider]=useState(50);
  const[playerSubmitted,setPlayerSubmitted]=useState(false);
  const roomRef=useRef(null);
  const listenerRef=useRef(null);
  const prevQ=useRef(null);

  const listenToRoom=useCallback((code)=>{
    if(listenerRef.current)listenerRef.current();
    const ref=db.ref("rooms/"+code);
    roomRef.current=ref;
    const cb=ref.on("value",snap=>{const d=snap.val();if(d)setRoomData(d);});
    listenerRef.current=()=>ref.off("value",cb);
  },[]);

  useEffect(()=>{return()=>{if(listenerRef.current)listenerRef.current();};},[]);

  useEffect(()=>{
    if(roomData&&roomData.currentQ!==prevQ.current){
      prevQ.current=roomData.currentQ;
      setPlayerAnswer(null);
      const q=QUESTIONS[roomData.currentQ];
      setPlayerSlider(q?Math.round((q.min+q.max)/2):50);
      setPlayerSubmitted(false);
    }
  },[roomData?.currentQ]);

  const createRoom=()=>{
    const code=genCode();
    const ref=db.ref("rooms/"+code);
    ref.set({phase:"lobby",currentQ:0,revealed:false,transition:null,players:{},answers:{}});
    setRoomCode(code);
    listenToRoom(code);
    setScreen("host-lobby");
  };
  const hostStart=()=>{roomRef.current.update({phase:"question",currentQ:0,revealed:false,transition:null});setScreen("host-game");};
  const hostReveal=()=>{
    roomRef.current.update({transition:"revealing"});
    setTimeout(()=>{roomRef.current.update({revealed:true,transition:null});},3000);
  };
  const hostNext=()=>{
    const nextQ=(roomData?.currentQ||0)+1;
    roomRef.current.update({transition:"nextQ"});
    setTimeout(()=>{
      if(nextQ<total)roomRef.current.update({currentQ:nextQ,revealed:false,transition:null});
      else roomRef.current.update({phase:"finished",transition:null});
    },2000);
  };
  const hostEnd=()=>{if(roomRef.current)roomRef.current.remove();if(listenerRef.current)listenerRef.current();setRoomData(null);setScreen("home");};

  const joinRoom=()=>{
    const code=joinCode.toUpperCase().trim();
    if(!code||!playerName.trim())return;
    const ref=db.ref("rooms/"+code);
    ref.once("value").then(snap=>{
      if(snap.exists()){
        ref.child("players/"+PLAYER_ID).set({name:playerName.trim()});
        setRoomCode(code);
        listenToRoom(code);
        setScreen("player-game");
      }else{alert("Room not found.");}
    });
  };

  const playerSubmitAnswer=()=>{
    if(!roomData||playerSubmitted)return;
    const q=QUESTIONS[roomData.currentQ];
    const val=q.type==="slider"?playerSlider:playerAnswer;
    if(val===null)return;
    roomRef.current.child("answers/"+roomData.currentQ+"/"+PLAYER_ID).set(val);
    setPlayerSubmitted(true);
  };

  const soloReset=(idx)=>{const nq=QUESTIONS[idx];setSoloAnim(false);setTimeout(()=>{setSoloQ(idx);setSoloRevealed(false);setChoiceVal(null);if(nq.type==="slider")setSliderVal(Math.round((nq.min+nq.max)/2));setSoloAnim(true);},300);};
  const soloSubmit=()=>{setSoloRevealed(true);const q=QUESTIONS[soloQ];let pts=0;if(q.type==="slider"){const d=Math.abs(sliderVal-q.correctAnswer);if(d<=5)pts=3;else if(d<=15)pts=2;else if(d<=25)pts=1;}else if(choiceVal===q.correctIndex)pts=3;setSoloScore(s=>s+pts);setSoloAnswers(a=>({...a,[q.id]:pts}));};
  const soloNext=()=>{if(soloQ<total-1)soloReset(soloQ+1);else setScreen("solo-results");};
  const soloRestart=()=>{setSoloScore(0);setSoloAnswers({});soloReset(0);setScreen("solo");};

  // ═══ HOME ═══
  if(screen==="home"){
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
        {flameSvg}
        <div style={{textAlign:"center",maxWidth:560,position:"relative",zIndex:1}}>
          <div style={{fontSize:11,letterSpacing:6,color:T.primary,marginBottom:28,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase",opacity:0.8}}>How well do you understand</div>
          <h1 style={{fontSize:"clamp(44px, 9vw, 76px)",fontWeight:800,color:"#fff",fontFamily:"'Playfair Display', Georgia, serif",lineHeight:1.05,margin:"0 0 8px",textShadow:"0 2px 40px rgba(255,107,26,0.15)"}}>Understand</h1>
          <h1 style={{fontSize:"clamp(44px, 9vw, 76px)",fontWeight:700,fontFamily:"'Playfair Display', Georgia, serif",lineHeight:1.05,margin:"0 0 12px",background:`linear-gradient(135deg, ${T.primary}, ${T.amber}, ${T.flame})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",filter:"drop-shadow(0 0 30px rgba(255,107,26,0.3))"}}><em>Energy</em></h1>
          <div style={{width:60,height:3,margin:"24px auto",background:`linear-gradient(90deg, transparent, ${T.primary}, transparent)`,borderRadius:2}}/>
          <p style={{fontSize:17,color:"rgba(255,255,255,0.4)",lineHeight:1.7,margin:"24px auto 20px",maxWidth:440,fontWeight:300}}>Most people score worse than random guessing on basic questions about energy, climate, poverty, and economics.</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",marginBottom:40}}>
            {Object.values(CATS).map(c=><span key={c.label} style={{padding:"6px 14px",borderRadius:20,fontSize:12,background:c.bg,color:c.color,border:`1px solid ${c.color}20`,fontFamily:"'JetBrains Mono', monospace",fontWeight:500}}>{c.label}</span>)}
          </div>
          <button onClick={()=>{soloReset(0);setSoloScore(0);setSoloAnswers({});setScreen("solo");}} style={{background:`linear-gradient(135deg, ${T.flame}, ${T.primary}, ${T.amber})`,border:"none",borderRadius:14,padding:"20px 56px",color:"#fff",fontSize:19,fontWeight:700,cursor:"pointer",fontFamily:"'Outfit', sans-serif",boxShadow:"0 4px 30px rgba(255,107,26,0.3), 0 0 60px rgba(255,69,0,0.15)",display:"block",margin:"0 auto"}}>
            Test Your Knowledge →
          </button>
          <div style={{marginTop:12,fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>{total} questions · ~8 minutes</div>
          {IS_HOST?(
            <div style={{marginTop:16}}>
              <button onClick={()=>setScreen("classroom-menu")} style={{background:"linear-gradient(135deg, #22C55E, #16A34A)",border:"none",borderRadius:14,padding:"20px 56px",color:"#fff",fontSize:19,fontWeight:700,cursor:"pointer",fontFamily:"'Outfit', sans-serif",boxShadow:"0 4px 30px rgba(34,197,94,0.25), 0 0 60px rgba(34,197,94,0.1)",display:"block",margin:"0 auto"}}>
                Classroom Mode
              </button>
            </div>
          ):(
            <div style={{marginTop:40,maxWidth:360,margin:"40px auto 0"}}>
              <div style={{padding:"24px",borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`}}>
                <div style={{fontSize:15,fontWeight:600,color:"#fff",marginBottom:4}}>Join a live session</div>
                <div style={{fontSize:13,color:T.textDim,marginBottom:16}}>Enter the code shown on screen</div>
                <input type="text" placeholder="ROOM CODE" value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} maxLength={5} style={{...inputStyle,letterSpacing:6,fontSize:20,textTransform:"uppercase",marginBottom:10}}/>
                <input type="text" placeholder="Your name" value={playerName} onChange={e=>setPlayerName(e.target.value)} maxLength={20} style={{...inputStyle,textAlign:"left",fontSize:15,marginBottom:12}}/>
                <Btn onClick={joinRoom} disabled={!joinCode.trim()||!playerName.trim()} style={{width:"100%",padding:"14px"}}>Join →</Btn>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══ CLASSROOM MENU ═══
  if(screen==="classroom-menu"){
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
        {flameSvg}
        <div style={{maxWidth:440,width:"100%",position:"relative",zIndex:1,textAlign:"center"}}>
          <button onClick={()=>setScreen("home")} style={{background:"none",border:"none",color:T.textFaint,cursor:"pointer",fontSize:14,padding:0,marginBottom:32,display:"block"}}>← Back</button>
          <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:28,color:"#fff",margin:"0 0 8px"}}>Host a Session</h2>
          <p style={{fontSize:15,color:T.textDim,margin:"0 0 40px",lineHeight:1.6,fontWeight:300}}>Create a room code for your audience to join on their phones.</p>
          <Btn onClick={createRoom} style={{padding:"18px 56px",fontSize:18}}>Create Room</Btn>
        </div>
      </div>
    );
  }

  // ═══ SOLO ═══
  if(screen==="solo"){
    const q=QUESTIONS[soloQ],cat=CATS[q.category],canSub=q.type==="choice"?choiceVal!==null:true;
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 24px 48px"}}>
        {flameSvg}
        <div style={{maxWidth:520,width:"100%",marginBottom:32,position:"relative",zIndex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <button onClick={()=>setScreen("home")} style={{background:"none",border:"none",color:T.textFaint,cursor:"pointer",fontSize:14,padding:0}}>←</button>
              <span style={{padding:"5px 14px",borderRadius:20,fontSize:12,background:cat.bg,color:cat.color,border:`1px solid ${cat.color}20`,fontFamily:"'JetBrains Mono', monospace"}}>{cat.label}</span>
            </div>
            <span style={{fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>{soloQ+1} / {total}</span>
          </div>
          <div style={{height:3,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}><div style={{height:"100%",background:`linear-gradient(90deg, ${T.flame}, ${T.primary}, ${T.amber})`,width:`${((soloQ+(soloRevealed?1:0))/total)*100}%`,transition:"width 0.6s"}}/></div>
        </div>
        <div style={{maxWidth:520,width:"100%",position:"relative",zIndex:1,opacity:soloAnim?1:0,transform:soloAnim?"translateY(0)":"translateY(20px)",transition:"opacity 0.4s, transform 0.4s"}}>
          <div style={{fontSize:36,marginBottom:16,textAlign:"center"}}>{q.icon}</div>
          <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:"clamp(22px, 4vw, 28px)",color:"#fff",fontWeight:400,textAlign:"center",lineHeight:1.4,margin:"0 0 32px"}}>{q.question}</h2>
          {q.type==="slider"&&<SliderInput min={q.min} max={q.max} unit={q.unit} value={sliderVal} onChange={setSliderVal} disabled={soloRevealed}/>}
          {q.type==="choice"&&<ChoiceInput options={q.options} selected={choiceVal} onSelect={setChoiceVal} disabled={soloRevealed} correctIndex={q.correctIndex} revealed={soloRevealed}/>}
          {!soloRevealed?(
            <Btn onClick={soloSubmit} disabled={!canSub} style={{width:"100%",marginTop:24,padding:"16px"}}>Lock In Answer</Btn>
          ):(
            <div style={{marginTop:32,padding:24,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`}}>
              {q.type==="slider"&&<div style={{marginBottom:20}}><AnimBar label="Your guess" value={sliderVal} max={q.max} color={T.error} delay={200}/><AnimBar label="Average guess" value={q.averageGuess} max={q.max} color="rgba(255,255,255,0.2)" delay={400}/><AnimBar label="Reality" value={q.correctAnswer} max={q.max} color={T.success} delay={600}/></div>}
              <p style={{fontSize:15,color:"rgba(255,255,255,0.65)",lineHeight:1.7,margin:"0 0 16px",fontWeight:300}}>{q.explanation}</p>
              <div style={{padding:"12px 16px",borderRadius:8,marginBottom:16,background:"rgba(255,107,26,0.06)",borderLeft:`3px solid ${T.primary}`}}><div style={{fontSize:14,color:T.primaryLight,lineHeight:1.6,fontWeight:500}}>💡 {q.insight}</div></div>
              <div style={{fontSize:12,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>Source: {q.source}</div>
              <Btn onClick={soloNext} style={{width:"100%",marginTop:20,padding:"16px"}}>{soloQ<total-1?"Next Question →":"See Your Results →"}</Btn>
            </div>
          )}
          <div style={{display:"flex",justifyContent:"center",marginTop:24,gap:6}}>
            {QUESTIONS.map((_,i)=><div key={i} style={{width:i===soloQ?24:8,height:8,borderRadius:4,background:soloAnswers[QUESTIONS[i].id]!==undefined?soloAnswers[QUESTIONS[i].id]>=2?T.success:soloAnswers[QUESTIONS[i].id]>=1?T.amber:T.error:i===soloQ?T.primary:"rgba(255,255,255,0.06)",transition:"all 0.3s",boxShadow:i===soloQ?"0 0 8px rgba(255,107,26,0.4)":"none"}}/>)}
          </div>
        </div>
      </div>
    );
  }

  if(screen==="solo-results"){
    const maxScore=total*3,cats={};
    QUESTIONS.forEach(q=>{if(!cats[q.category])cats[q.category]={c:0,t:0};cats[q.category].t+=3;cats[q.category].c+=soloAnswers[q.id]||0;});
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 24px"}}>
        {flameSvg}
        <div style={{maxWidth:480,width:"100%",textAlign:"center",position:"relative",zIndex:1}}>
          <div style={{fontSize:11,letterSpacing:6,color:T.primary,marginBottom:12,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase"}}>Your Results</div>
          <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:34,color:"#fff",fontWeight:400,margin:"0 0 40px"}}>How well do you<br/><em style={{background:`linear-gradient(135deg, ${T.primary}, ${T.amber})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>understand energy?</em></h2>
          <ScoreRing score={soloScore} total={maxScore}/>
          <div style={{marginTop:40,textAlign:"left"}}>
            <div style={{fontSize:11,letterSpacing:4,color:T.textFaint,marginBottom:16,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase"}}>By Category</div>
            {Object.entries(cats).map(([k,v])=><AnimBar key={k} label={CATS[k].label} value={Math.round((v.c/v.t)*100)} max={100} color={CATS[k].color} delay={300}/>)}
          </div>
          <div style={{marginTop:32,padding:20,borderRadius:12,background:"rgba(255,107,26,0.03)",border:"1px solid rgba(255,107,26,0.1)",textAlign:"left"}}>
            <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",lineHeight:1.7,fontWeight:300}}>Don't worry — most people score poorly. <strong style={{color:T.primary,fontWeight:600}}>Understanding energy starts with discovering what you got wrong.</strong></div>
          </div>
          <div style={{display:"flex",gap:12,marginTop:32,justifyContent:"center"}}><Btn onClick={soloRestart}>Play Again</Btn><Btn variant="secondary" onClick={()=>setScreen("home")}>Home</Btn></div>
        </div>
      </div>
    );
  }

  // ═══ HOST LOBBY ═══
  if(screen==="host-lobby"){
    const players=roomData?.players||{};const pc=Object.keys(players).length;
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
        {flameSvg}
        <div style={{maxWidth:600,width:"100%",textAlign:"center",position:"relative",zIndex:1}}>
          <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:34,color:"#fff",margin:"0 0 32px"}}>Understand <em style={{color:T.primary}}>Energy</em></h2>
          <div style={{padding:32,borderRadius:20,background:T.cardBg,border:`1px solid ${T.cardBorder}`,marginBottom:32}}>
            <div style={{fontSize:13,color:T.textDim,marginBottom:16,fontFamily:"'JetBrains Mono', monospace"}}>Scan to join:</div>
            <div style={{display:"inline-block",padding:12,background:"#fff",borderRadius:12,marginBottom:20}}>
              <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(BASE_URL+"?join="+roomCode)}`} alt="QR Code" style={{display:"block",width:200,height:200}}/>
            </div>
            <div style={{fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace",marginBottom:24,wordBreak:"break-all"}}>{BASE_URL.replace(/^https?:\/\//,"")}?join={roomCode}</div>
            <div style={{width:60,height:1,margin:"0 auto 20px",background:"rgba(255,255,255,0.08)"}}/>
            <div style={{fontSize:13,color:T.textDim,marginBottom:12,fontFamily:"'JetBrains Mono', monospace"}}>Or enter code manually:</div>
            <div style={{fontSize:72,fontWeight:800,fontFamily:"'JetBrains Mono', monospace",color:"#fff",letterSpacing:12,textShadow:"0 0 40px rgba(255,107,26,0.4)"}}>{roomCode}</div>
            <div style={{marginTop:20}}><PlayerCount count={pc}/></div>
            <div style={{marginTop:16,display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
              {Object.values(players).map((p,i)=><span key={i} style={{padding:"3px 10px",borderRadius:12,background:"rgba(255,255,255,0.05)",color:T.textDim,fontSize:12}}>{p.name}</span>)}
            </div>
          </div>
          <Btn onClick={hostStart} disabled={pc<1} style={{padding:"18px 48px",fontSize:18}}>Start Quiz ({total} questions) →</Btn>
          <div style={{marginTop:16}}><button onClick={hostEnd} style={{background:"none",border:"none",color:T.textDim,cursor:"pointer",fontSize:14}}>← Cancel</button></div>
        </div>
      </div>
    );
  }

  // ═══ HOST GAME ═══
  if(screen==="host-game"&&roomData){
    if(roomData.phase==="finished"){
      const players=roomData?.players||{};
      return(
        <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
          {flameSvg}
          <div style={{maxWidth:560,width:"100%",textAlign:"center",position:"relative",zIndex:1}}>
            <div style={{fontSize:64,marginBottom:16}}>🎓</div>
            <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:38,color:"#fff",margin:"0 0 16px"}}>Session <em style={{color:T.primary}}>Complete</em></h2>
            <p style={{color:T.textDim,fontSize:16,lineHeight:1.7,margin:"0 0 32px"}}>{Object.keys(players).length} participants completed {total} questions.</p>
            <div style={{display:"flex",gap:12,justifyContent:"center"}}><Btn onClick={createRoom}>New Session</Btn><Btn variant="secondary" onClick={hostEnd}>Home</Btn></div>
          </div>
        </div>
      );
    }
    const q=QUESTIONS[roomData.currentQ],cat=CATS[q.category];
    const players=roomData?.players||{},pc=Object.keys(players).length;
    const qa=roomData?.answers?.[roomData.currentQ]||{},ac=Object.keys(qa).length;
    const allIn=ac>=pc&&pc>0;
    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 24px"}}>
        {flameSvg}
        <div style={{maxWidth:700,width:"100%",position:"relative",zIndex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",gap:12,alignItems:"center"}}>
              <button onClick={hostEnd} style={{background:"none",border:"none",color:T.textFaint,cursor:"pointer",fontSize:14,padding:0}}>←</button>
              <span style={{padding:"5px 14px",borderRadius:20,fontSize:12,background:cat.bg,color:cat.color,fontFamily:"'JetBrains Mono', monospace"}}>{cat.label}</span>
              <span style={{fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>Q{roomData.currentQ+1}/{total}</span>
            </div>
            <div style={{display:"flex",gap:12,alignItems:"center"}}>
              <PlayerCount count={pc}/>
              <div style={{padding:"6px 14px",borderRadius:20,background:allIn?"rgba(34,197,94,0.1)":"rgba(255,107,26,0.1)",border:allIn?"1px solid rgba(34,197,94,0.2)":"1px solid rgba(255,107,26,0.2)"}}>
                <span style={{fontSize:13,color:allIn?T.success:T.primary,fontFamily:"'JetBrains Mono', monospace",fontWeight:600}}>{ac}/{pc} answered</span>
              </div>
            </div>
          </div>
          <div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden",marginBottom:32}}><div style={{height:"100%",background:`linear-gradient(90deg, ${T.flame}, ${T.primary}, ${T.amber})`,width:`${((roomData.currentQ+(roomData.revealed?1:0))/total)*100}%`,transition:"width 0.6s"}}/></div>
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{fontSize:48,marginBottom:16}}>{q.icon}</div>
            <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:"clamp(26px, 4vw, 36px)",color:"#fff",fontWeight:400,lineHeight:1.35,margin:0}}>{q.question}</h2>
          </div>
          {roomData.transition==="revealing"?(
            <div style={{textAlign:"center",padding:"60px 0"}}>
              <style>{`
                @keyframes revealRing{0%{stroke-dashoffset:283}100%{stroke-dashoffset:0}}
                @keyframes revealFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
                @keyframes revealGlow{0%,100%{opacity:0.4}50%{opacity:1}}
              `}</style>
              <div style={{position:"relative",width:120,height:120,margin:"0 auto 32px"}}>
                <svg width="120" height="120" style={{transform:"rotate(-90deg)"}}><circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="6"/><circle cx="60" cy="60" r="45" fill="none" stroke={T.primary} strokeWidth="6" strokeLinecap="round" strokeDasharray="283" style={{animation:"revealRing 2.8s ease-in-out forwards"}}/></svg>
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:T.primary,boxShadow:"0 0 20px rgba(255,107,26,0.6)",animation:"revealGlow 1s ease infinite"}}/>
                </div>
              </div>
              <div style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:24,color:"#fff",marginBottom:8,animation:"revealFade 0.5s ease forwards"}}>Revealing results</div>
              <div style={{fontSize:14,color:T.textDim,animation:"revealFade 0.5s ease 0.3s both"}}>How did the audience answer?</div>
            </div>
          ):roomData.transition==="nextQ"?(
            <div style={{textAlign:"center",padding:"60px 0"}}>
              <style>{`
                @keyframes nextSlide{0%{opacity:0;transform:scale(0.8)}30%{opacity:1;transform:scale(1.05)}50%{transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}
                @keyframes nextBar{0%{width:0}100%{width:100%}}
              `}</style>
              
              <div style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:24,color:"#fff",marginBottom:24}}>Next question...</div>
              <div style={{maxWidth:200,margin:"0 auto",height:4,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:2,background:`linear-gradient(90deg, ${T.primary}, ${T.amber})`,animation:"nextBar 1.8s ease forwards"}}/></div>
            </div>
          ):!roomData.revealed?(
            <div style={{textAlign:"center"}}>
              <div style={{padding:32,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`,marginBottom:24}}>
                <div style={{fontSize:14,letterSpacing:3,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace",textTransform:"uppercase",marginBottom:16}}>Collecting answers...</div>
                <div style={{fontSize:48,fontWeight:800,fontFamily:"'JetBrains Mono', monospace",color:allIn?T.success:T.primary,marginBottom:8,transition:"color 0.5s"}}>{ac}/{pc}</div>
                <div style={{maxWidth:300,margin:"16px auto 0",height:8,borderRadius:4,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,background:allIn?`linear-gradient(90deg, ${T.success}, #4ADE80)`:`linear-gradient(90deg, ${T.primary}, ${T.amber})`,width:`${pc>0?(ac/pc)*100:0}%`,transition:"width 0.6s cubic-bezier(0.16,1,0.3,1)"}}/></div>
                <div style={{color:T.textDim,fontSize:14,marginTop:12}}>{allIn?"Everyone's in!":"waiting for responses..."}</div>
              </div>
              <style>{`@keyframes btnPulse{0%,100%{box-shadow:0 4px 20px rgba(255,107,26,0.25)}50%{box-shadow:0 4px 40px rgba(255,107,26,0.5), 0 0 60px rgba(255,107,26,0.2)}}`}</style>
              <Btn onClick={hostReveal} disabled={ac<1} style={{padding:"16px 48px",fontSize:18,animation:allIn?"btnPulse 1.5s ease infinite":"none"}}>Reveal Results</Btn>
            </div>
          ):(
            <div>
              <div style={{padding:28,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`,marginBottom:24}}>
                <DistributionChart answers={qa} correctAnswer={q.type==="slider"?q.correctAnswer:q.correctIndex} type={q.type} options={q.options} unit={q.unit}/>
              </div>
              <div style={{padding:24,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`,marginBottom:24}}>
                <p style={{fontSize:16,color:"rgba(255,255,255,0.65)",lineHeight:1.7,margin:"0 0 16px",fontWeight:300}}>{q.explanation}</p>
                <div style={{padding:"12px 16px",borderRadius:8,background:"rgba(255,107,26,0.06)",borderLeft:`3px solid ${T.primary}`}}><div style={{fontSize:15,color:T.primaryLight,lineHeight:1.6,fontWeight:500}}>💡 {q.insight}</div></div>
                <div style={{fontSize:12,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace",marginTop:12}}>Source: {q.source}</div>
              </div>
              <div style={{textAlign:"center"}}><Btn onClick={hostNext} style={{padding:"16px 48px",fontSize:18}}>{roomData.currentQ<total-1?"Next Question →":"Finish Session →"}</Btn></div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══ PLAYER GAME ═══
  if(screen==="player-game"){
    if(!roomData)return(<div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>{flameSvg}<div style={{textAlign:"center",position:"relative",zIndex:1}}><div style={{fontSize:24,marginBottom:16}}>⏳</div><p style={{color:T.textDim}}>Connecting...</p></div></div>);

    if(roomData.phase==="lobby"){
      const players=roomData?.players||{},pc=Object.keys(players).length;
      return(<div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>{flameSvg}<div style={{textAlign:"center",maxWidth:400,position:"relative",zIndex:1}}><div style={{fontSize:48,marginBottom:16}}>✅</div><h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:28,color:"#fff",margin:"0 0 8px"}}>You're in!</h2><p style={{color:T.textDim,fontSize:16,margin:"0 0 24px"}}>Waiting for the host to start...</p><PlayerCount count={pc}/><div style={{marginTop:24,display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>{Object.values(players).map((p,i)=><span key={i} style={{padding:"3px 10px",borderRadius:12,background:"rgba(255,255,255,0.05)",color:T.textDim,fontSize:12}}>{p.name}</span>)}</div></div></div>);
    }

    if(roomData.phase==="finished"){
      return(<div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>{flameSvg}<div style={{textAlign:"center",position:"relative",zIndex:1}}><div style={{fontSize:64,marginBottom:16}}>🎓</div><h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:28,color:"#fff",margin:"0 0 16px"}}>Session Complete</h2><p style={{color:T.textDim,fontSize:16,margin:"0 0 32px"}}>Thanks for playing!</p><Btn onClick={()=>{if(listenerRef.current)listenerRef.current();setRoomData(null);setScreen("home");}}>Home</Btn></div></div>);
    }

    const q=QUESTIONS[roomData.currentQ],cat=CATS[q.category];
    const myAnswer=roomData?.answers?.[roomData.currentQ]?.[PLAYER_ID];
    const hasAnswered=myAnswer!==undefined||playerSubmitted;

    // Player sees same transition animations as host
    if(roomData.transition==="revealing"){
      return(
        <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
          {flameSvg}
          <div style={{textAlign:"center",position:"relative",zIndex:1}}>
            <style>{`
              @keyframes revealRing{0%{stroke-dashoffset:283}100%{stroke-dashoffset:0}}
              @keyframes revealFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
              @keyframes revealGlow{0%,100%{opacity:0.4}50%{opacity:1}}
            `}</style>
            <div style={{position:"relative",width:120,height:120,margin:"0 auto 32px"}}>
              <svg width="120" height="120" style={{transform:"rotate(-90deg)"}}><circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="6"/><circle cx="60" cy="60" r="45" fill="none" stroke={T.primary} strokeWidth="6" strokeLinecap="round" strokeDasharray="283" style={{animation:"revealRing 2.8s ease-in-out forwards"}}/></svg>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <div style={{width:12,height:12,borderRadius:"50%",background:T.primary,boxShadow:"0 0 20px rgba(255,107,26,0.6)",animation:"revealGlow 1s ease infinite"}}/>
              </div>
            </div>
            <div style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:24,color:"#fff",marginBottom:8,animation:"revealFade 0.5s ease forwards"}}>Revealing results</div>
            <div style={{fontSize:14,color:T.textDim,animation:"revealFade 0.5s ease 0.3s both"}}>How did the audience answer?</div>
          </div>
        </div>
      );
    }

    if(roomData.transition==="nextQ"){
      return(
        <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
          {flameSvg}
          <div style={{textAlign:"center",position:"relative",zIndex:1}}>
            <style>{`
              @keyframes nextSlide{0%{opacity:0;transform:scale(0.8)}30%{opacity:1;transform:scale(1.05)}50%{transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}
              @keyframes nextBar{0%{width:0}100%{width:100%}}
            `}</style>
            
            <div style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:24,color:"#fff",marginBottom:24}}>Next question...</div>
            <div style={{maxWidth:200,margin:"0 auto",height:4,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:2,background:`linear-gradient(90deg, ${T.primary}, ${T.amber})`,animation:"nextBar 1.8s ease forwards"}}/></div>
          </div>
        </div>
      );
    }

    if(roomData.revealed){
      const wasCorrect=q.type==="slider"?Math.abs((myAnswer||0)-q.correctAnswer)<=5:myAnswer===q.correctIndex;
      const yourAnswerText=q.type==="slider"?(myAnswer!=null?myAnswer+(q.unit||""):"—"):(myAnswer!=null&&q.options[myAnswer]?q.options[myAnswer]:"—");
      const correctText=q.type==="slider"?q.correctAnswer+(q.unit||""):q.options[q.correctIndex];
      return(
        <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 24px 48px"}}>
          {flameSvg}
          <div style={{maxWidth:520,width:"100%",position:"relative",zIndex:1}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <span style={{padding:"5px 14px",borderRadius:20,fontSize:12,background:cat.bg,color:cat.color,fontFamily:"'JetBrains Mono', monospace"}}>{cat.label}</span>
              <span style={{fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>Q{roomData.currentQ+1}/{total}</span>
            </div>
            <div style={{padding:20,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`,marginBottom:16}}>
              <DistributionChart answers={roomData?.answers?.[roomData.currentQ]||{}} correctAnswer={q.type==="slider"?q.correctAnswer:q.correctIndex} type={q.type} options={q.options} unit={q.unit}/>
            </div>
            <div style={{display:"flex",gap:12,marginBottom:16}}>
              <div style={{flex:1,padding:"16px 20px",borderRadius:14,background:wasCorrect?"rgba(34,197,94,0.08)":"rgba(239,68,68,0.08)",border:`1px solid ${wasCorrect?"rgba(34,197,94,0.25)":"rgba(239,68,68,0.25)"}`}}>
                <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:2,color:T.textFaint,marginBottom:8,fontFamily:"'JetBrains Mono', monospace"}}>You answered</div>
                <div style={{fontSize:22,fontWeight:700,color:wasCorrect?T.success:T.error,fontFamily:"'JetBrains Mono', monospace"}}>{yourAnswerText}</div>
              </div>
              <div style={{flex:1,padding:"16px 20px",borderRadius:14,background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.25)"}}>
                <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:2,color:T.textFaint,marginBottom:8,fontFamily:"'JetBrains Mono', monospace"}}>Correct answer</div>
                <div style={{fontSize:22,fontWeight:700,color:T.success,fontFamily:"'JetBrains Mono', monospace"}}>{correctText}</div>
              </div>
            </div>
            <div style={{padding:20,borderRadius:16,background:T.cardBg,border:`1px solid ${T.cardBorder}`}}>
              <p style={{fontSize:15,color:"rgba(255,255,255,0.65)",lineHeight:1.7,margin:"0 0 16px",fontWeight:300}}>{q.explanation}</p>
              <div style={{padding:"12px 16px",borderRadius:8,background:"rgba(255,107,26,0.06)",borderLeft:`3px solid ${T.primary}`}}><div style={{fontSize:14,color:T.primaryLight,lineHeight:1.6,fontWeight:500}}>💡 {q.insight}</div></div>
              <div style={{fontSize:12,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace",marginTop:12}}>Source: {q.source}</div>
            </div>
            <p style={{textAlign:"center",color:T.textFaint,fontSize:14,marginTop:24}}>Waiting for next question...</p>
          </div>
        </div>
      );
    }

    if(hasAnswered){
      return(<div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>{flameSvg}<div style={{textAlign:"center",position:"relative",zIndex:1}}><div style={{width:48,height:48,borderRadius:"50%",background:"rgba(34,197,94,0.15)",border:"2px solid rgba(34,197,94,0.3)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:22,color:T.success}}>✓</div><h3 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:24,color:"#fff",margin:"0 0 8px"}}>Answer submitted</h3><p style={{color:T.textDim,fontSize:16}}>Waiting for everyone else...</p></div></div>);
    }

    return(
      <div style={{...pageStyle,display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 24px 48px"}}>
        {flameSvg}
        <div style={{maxWidth:520,width:"100%",position:"relative",zIndex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <span style={{padding:"5px 14px",borderRadius:20,fontSize:12,background:cat.bg,color:cat.color,fontFamily:"'JetBrains Mono', monospace"}}>{cat.label}</span>
            <span style={{fontSize:13,color:T.textFaint,fontFamily:"'JetBrains Mono', monospace"}}>Q{roomData.currentQ+1}/{total}</span>
          </div>
          <div style={{height:3,borderRadius:2,background:"rgba(255,255,255,0.05)",overflow:"hidden",marginBottom:24}}><div style={{height:"100%",background:`linear-gradient(90deg, ${T.flame}, ${T.primary}, ${T.amber})`,width:`${(roomData.currentQ/total)*100}%`,transition:"width 0.6s"}}/></div>
          <div style={{fontSize:36,marginBottom:16,textAlign:"center"}}>{q.icon}</div>
          <h2 style={{fontFamily:"'Playfair Display', Georgia, serif",fontSize:"clamp(20px, 4vw, 26px)",color:"#fff",fontWeight:400,textAlign:"center",lineHeight:1.4,margin:"0 0 28px"}}>{q.question}</h2>
          {q.type==="slider"&&<SliderInput min={q.min} max={q.max} unit={q.unit} value={playerSlider} onChange={setPlayerSlider} disabled={false}/>}
          {q.type==="choice"&&(
            <div style={{display:"grid",gap:12,width:"100%"}}>
              {q.options.map((opt,i)=>{
                const isSel=playerAnswer===i;
                return(
                  <button key={i} onClick={()=>setPlayerAnswer(i)} style={{background:isSel?"rgba(255,107,26,0.12)":T.navyLight,border:isSel?"1px solid rgba(255,107,26,0.4)":"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:"16px 20px",color:isSel?"#fff":"rgba(255,255,255,0.7)",fontSize:16,fontFamily:"'Outfit', sans-serif",cursor:"pointer",textAlign:"left",transition:"all 0.3s",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{width:30,height:30,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0,fontFamily:"'JetBrains Mono', monospace",background:isSel?"rgba(255,107,26,0.2)":"rgba(255,255,255,0.05)",color:isSel?T.primary:"rgba(255,255,255,0.35)"}}>{String.fromCharCode(65+i)}</span>{opt}
                  </button>
                );
              })}
            </div>
          )}
          <Btn onClick={playerSubmitAnswer} disabled={q.type==="choice"&&playerAnswer===null} style={{width:"100%",marginTop:24,padding:"16px"}}>Lock In Answer</Btn>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

    // Google Calendar API — push a single event
    async function pushEventToGCal(token, summary, date, reminders) {
      const reminderMinutes = [];
      if(reminders && reminders.length) {
        reminders.forEach(r => {
          if(r === "same") reminderMinutes.push(0);
          if(r === "1d") reminderMinutes.push(1440);
          if(r === "2d") reminderMinutes.push(2880);
          if(r === "3d") reminderMinutes.push(4320);
          if(r === "7d") reminderMinutes.push(10080);
        });
      }
      const event = {
        summary: summary,
        start: { date: date },
        end: { date: date },
        reminders: {
          useDefault: false,
          overrides: reminderMinutes.length
            ? reminderMinutes.map(m => ({ method: "email", minutes: m }))
            : [{ method: "email", minutes: 1440 }]
        }
      };
      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(event)
      });
      if(!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error?.message || "Calendar API error");
      }
      return await res.json();
    }

    // Request Calendar access — separate popup with scope
    async function getGoogleCalendarToken() {
      try {
        const calProvider = new firebase.auth.GoogleAuthProvider();
        calProvider.addScope("https://www.googleapis.com/auth/calendar.events");
        const result = await auth.currentUser.reauthenticateWithPopup(calProvider);
        googleAccessToken = result.credential.accessToken;
        return googleAccessToken;
      } catch(e) {
        console.error("Calendar auth error:", e);
        return null;
      }
    }
  </script>

const CLIENT_COLORS=["#6c5ce7","#00d2a0","#f0a030","#ff4757","#0abde3","#e056a0","#2ed573","#ffa502","#a78bfa","#00b894"];
const DAYS=["sön","mån","tis","ons","tor","fre","lör"];
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,5);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseD=s=>{const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd,12)};
const fmtShort=s=>{const d=new Date(s);return`${d.getDate()} ${MONTHS[d.getMonth()]}`};
const fmtDay=s=>DAYS[new Date(s).getDay()];
const isToday=s=>s===iso(new Date());
const isPast=s=>new Date(s)<new Date(iso(new Date()));
const getWeekNum=s=>{const d=parseD(s);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w)/864e5-3+(w.getDay()+6)%7)/7)};
function skipWknd(d){while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d}
function skipWkndFwd(d){while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d}
function subBizDays(d,n){let r=n;while(r>0){d.setDate(d.getDate()-1);if(d.getDay()!==0&&d.getDay()!==6)r--}return d}
function addBizDays(d,n){let r=n;while(r>0){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)r--}return d}
function calcSteps(tpl,dl,skip=true){
  const pre=tpl.steps.filter(s=>!s.after);
  const post=tpl.steps.filter(s=>s.after);
  const st=[];
  // Pre-deadline steps (backward from deadline)
  let c=parseD(dl);
  if(skip)skipWknd(c);
  for(let i=pre.length-1;i>=0;i--){
    st.unshift({name:pre[i].name,date:iso(c),completed:false});
    if(i>0){if(skip)subBizDays(c,pre[i].days);else c.setDate(c.getDate()-pre[i].days)}
  }
  // Post-deadline steps (forward from deadline)
  if(post.length>0){
    let p=parseD(dl);
    for(let i=0;i<post.length;i++){
      if(skip)addBizDays(p,post[i].days);else p.setDate(p.getDate()+post[i].days);
      st.push({name:post[i].name,date:iso(p),completed:false,after:true});
    }
  }
  return st;
}

// ===== LOGIN SCREEN =====
function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [isSignup,setIsSignup]=useState(false);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [showMore,setShowMore]=useState(false);
  const [showPrivacy,setShowPrivacy]=useState(false);

  const doEmail=async()=>{
    if(!email||!pass){setErr("Fyll i e-post och lösenord");return}
    setLoading(true);setErr("");
    try{
      let cred;
      if(isSignup) cred=await auth.createUserWithEmailAndPassword(email,pass);
      else cred=await auth.signInWithEmailAndPassword(email,pass);
      onLogin({type:"email",email:cred.user.email,uid:cred.user.uid});
    }catch(e){
      if(e.code==="auth/user-not-found")setErr("Inget konto hittades — skapa ett nytt");
      else if(e.code==="auth/wrong-password")setErr("Fel lösenord");
      else if(e.code==="auth/email-already-in-use")setErr("E-posten används redan");
      else if(e.code==="auth/weak-password")setErr("Lösenordet måste vara minst 6 tecken");
      else setErr(e.message);
    }
    setLoading(false);
  };

  const doGoogle=async()=>{
    setLoading(true);setErr("");
    try{
      const cred=await auth.signInWithPopup(googleProvider);
      onLogin({type:"google",email:cred.user.email,uid:cred.user.uid});
    }catch(e){setErr(e.message)}
    setLoading(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:C.bg,zIndex:3000,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,maxWidth:480,margin:"0 auto"}}>
      <div style={{width:56,height:56,background:`linear-gradient(135deg,${C.ac},${C.ac}88)`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:800,color:"#fff",marginBottom:20}}>DF</div>
      <h1 style={{fontSize:24,fontWeight:800,color:C.t1,marginBottom:4}}>DeadlineFlow</h1>
      <p style={{fontSize:13,color:C.t3,marginBottom:6}}>Planera. Följ upp. Leverera.</p>
      <p style={{fontSize:11,color:C.t3,marginBottom:28,textAlign:"center",maxWidth:260}}>Logga in med Google för att synka med Google Calendar.</p>

      {err&&<div style={{padding:"8px 14px",background:C.rd+"15",border:`1px solid ${C.rd}30`,borderRadius:8,marginBottom:12,fontSize:12,color:C.rd,maxWidth:300,width:"100%",textAlign:"center"}}>{err}</div>}

      {/* PRIMARY — Google */}
      <button onClick={doGoogle} disabled={loading}
        style={{width:"100%",maxWidth:300,padding:16,borderRadius:12,background:C.bg3,border:`1px solid ${C.bd}`,color:C.t1,fontSize:15,fontWeight:700,fontFamily:"inherit",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,opacity:loading?0.6:1}}>
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Logga in med Google
      </button>

      {/* COLLAPSIBLE — other options */}
      <div onClick={()=>setShowMore(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,margin:"20px 0 8px",cursor:"pointer",width:"100%",maxWidth:300}}>

        </span>

      {showMore&&(

          <input value={pass} onChange={e=>setPass(e.target.value)} placeholder="Lösenord" type="password"

            style={{padding:"12px 14px",background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:10,color:C.t1,fontFamily:"inherit",fontSize:14,outline:"none"}}/>
          <button onClick={doEmail} disabled={loading}
            style={{padding:12,borderRadius:10,background:C.ac,border:"none",color:"#fff",fontSize:14,fontWeight:700,fontFamily:"inherit",cursor:"pointer",opacity:loading?0.6:1}}>

          </button>
          <div onClick={()=>setIsSignup(v=>!v)} style={{fontSize:11,color:C.ac,textAlign:"center",cursor:"pointer",padding:2}}>

          </div>

          <div style={{height:1,background:C.bd,margin:"4px 0"}}/>

          <button onClick={()=>onLogin({type:"test",uid:"test_user"})} disabled={loading}
            style={{padding:10,borderRadius:8,background:"transparent",border:`1px solid ${C.bd}`,color:C.t3,fontSize:12,fontFamily:"inherit",cursor:"pointer"}}>
            Testa utan konto (ingen sync)
          </button>
        </div>
      )}

      {/* Privacy policy link */}
      <div onClick={()=>setShowPrivacy(true)} style={{position:"absolute",bottom:24,right:24,width:28,height:28,borderRadius:"50%",background:C.bg3,border:`1px solid ${C.bd}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
        <span style={{fontSize:13,fontWeight:700,color:C.t3}}>?</span>
      </div>

      {showPrivacy&&<PrivacyModal onClose={()=>setShowPrivacy(false)}/>}
    </div>
  );
}

// ===== CONFETTI BURST =====
function ConfettiBurst({delay=0}){
  const ref=useRef(null);
  useEffect(()=>{
    const timer=setTimeout(()=>{
      const canvas=ref.current;if(!canvas)return;
      const ctx=canvas.getContext("2d");
      const W=canvas.offsetWidth,H=canvas.offsetHeight;
      canvas.width=W*2;canvas.height=H*2;ctx.scale(2,2);
      const colors=["#2ed573","#00d2a0","#7bed9f","#a8e6cf"];
      const particles=[];
      for(let i=0;i<16;i++){
        const angle=-Math.PI/2+(Math.random()-0.5)*Math.PI;
        particles.push({
          x:W/2+(Math.random()-0.5)*8,
          y:H/2+(Math.random()-0.5)*6,
          vx:Math.cos(angle)*(0.4+Math.random()*1),
          vy:-0.6-Math.random()*1.4,
          w:1.5+Math.random()*2.5,h:1+Math.random()*2,
          color:colors[Math.floor(Math.random()*colors.length)],
          rot:Math.random()*360,
          rv:2+Math.random()*4*(Math.random()>0.5?1:-1),
          life:1,decay:0.015+Math.random()*0.008,
          gravity:0.03,
        });
      }
      let raf;
      const draw=()=>{
        ctx.clearRect(0,0,W,H);
        let alive=false;
        particles.forEach(p=>{
          if(p.life<=0)return;
          alive=true;
          p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;
          p.rot+=p.rv;p.life-=p.decay;
          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(p.rot*Math.PI/180);
          ctx.globalAlpha=Math.min(1,p.life*2);
          ctx.fillStyle=p.color;
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
          ctx.restore();
        });
        if(alive)raf=requestAnimationFrame(draw);
      };
      raf=requestAnimationFrame(draw);
      return()=>cancelAnimationFrame(raf);
    },delay);
    return()=>clearTimeout(timer);
  },[delay]);
  return <canvas ref={ref} style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:70,height:70,zIndex:6,pointerEvents:"none"}}/>;
}

// ===== ONBOARDING =====
function Onboarding({onDone}){
  const [slide,setSlide]=useState(0);
  const [f,setF]=useState(0);
  const [pct,setPct]=useState(0);
  const [s3Done,setS3Done]=useState([]);
  const [slideStarted,setSlideStarted]=useState({0:true});
  const [revisiting,setRevisiting]=useState(false);

  const totalFrames=[10,7,1];
  
  const goSlide=(s)=>{
    const alreadySeen=!!slideStarted[s];
    setRevisiting(alreadySeen);
    setSlide(s);
    if(!alreadySeen){
      setSlideStarted(prev=>({...prev,[s]:true}));
      setF(0);setPct(0);
    }
  };

  useEffect(()=>{
    if(!slideStarted[slide]||revisiting)return;
    const iv=setInterval(()=>setF(n=>{
      const next=n+1;
      if(next>=totalFrames[slide]){clearInterval(iv);return totalFrames[slide]-1}
      return next;
    }),900);
    return()=>clearInterval(iv);
  },[slide,slideStarted]);

  // Smooth percentage counter during loading
  const loadActive=slide===1&&f>=1&&f<=2;
  useEffect(()=>{
    if(!loadActive)return;
    setPct(0);
    const start=performance.now();
    const dur=2400;
    let raf;
    const tick=()=>{const p=Math.min((performance.now()-start)/dur,1);setPct(Math.round(p*100));if(p<1)raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[loadActive]);

  const remLabels=["Samma dag","1 dag innan","3 dagar innan"];
  const remsOn=slide===0?Math.min(Math.floor((f+1)/2),3):3;

                <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:i<5?`1px solid ${C.bd}`:"none"}}>
                  <span style={{fontFamily:"monospace",fontSize:10,color:C.t3,width:16,textAlign:"center"}}>{i+1}</span>
                  <span style={{flex:1,fontSize:12,color:C.t1}}>{name}</span>
                  <span style={{fontFamily:"monospace",fontSize:11,color:C.ac,background:C.ac+"15",padding:"2px 6px",borderRadius:4}}>{[2,1,2,2,2,0][i]}d</span>
                </div>

                    <svg width="14" height="18" viewBox="0 0 14 18"><path d="M1 1l11 7.5-5 1L5 15z" fill="#fff" stroke="#222" strokeWidth="1"/></svg>

    const t=[];
    data.projects.forEach(p=>{const c=data.clients.find(x=>x.id===p.clientId);
      p.steps.forEach((s,i)=>{const dlI=p.steps.reduce((a,x,j)=>x.after?a:j,-1);t.push({pid:p.id,si:i,name:s.name,date:s.date,done:s.completed,client:c?c.name:"",color:c?c.color:"#6c5ce7",pname:p.name,isDL:i===dlI,isAfter:!!s.after})})});
    return t.sort((a,b)=>a.date.localeCompare(b.date));
  },[data]);

  const byDate=useMemo(()=>{const m={};tasks.forEach(t=>{if(!m[t.date])m[t.date]=[];m[t.date].push(t)});return m},[tasks]);

  if(!data.projects.length) return(
    <div style={{textAlign:"center",padding:"80px 20px"}}>
      <div style={{fontSize:44,marginBottom:12,opacity:0.6}}>📋</div>
      <div style={{fontSize:18,fontWeight:700,color:C.t1,marginBottom:6}}>Inga projekt ännu</div>
      <p style={{fontSize:14,color:C.t3}}>Tryck + nedan för att komma igång</p>
    </div>
  );

  const today=new Date(),todayS=iso(today);
  const todayDow=today.getDay();
  const isWeekend=todayDow===0||todayDow===6;

  const todayTasks=byDate[todayS]||[];
  const todayUndone=todayTasks.filter(t=>!t.done);
  const todayDone=todayTasks.filter(t=>t.done);
  const overdue=tasks.filter(t=>!t.done&&isPast(t.date)&&!isToday(t.date));

  const upcoming=[];
  const d2=new Date(today);d2.setDate(d2.getDate()+1);
  let count=0;
  while(count<4&&upcoming.length<10){
    const ds=iso(d2);
    if(d2.getDay()!==0&&d2.getDay()!==6){
      const dt=byDate[ds];
      if(dt&&dt.length>0)upcoming.push({date:ds,dow:d2.getDay(),num:d2.getDate(),tasks:dt});
      count++;
    }
    d2.setDate(d2.getDate()+1);
  }

  const futureStart=new Date(today);futureStart.setDate(futureStart.getDate()+8);
  while(futureStart.getDay()!==1)futureStart.setDate(futureStart.getDate()+1);
  const futureEnd=new Date(today);futureEnd.setDate(futureEnd.getDate()+56);
  const weeks=[];let cw=null,cDays=[];
  const fd=new Date(futureStart);
  while(fd<=futureEnd){
    const ds=iso(fd),wn=getWeekNum(ds),dow=fd.getDay();
    if(wn!==cw){
      if(cw!==null&&cDays.length)weeks.push({wn:cw,days:cDays});
      cw=wn;cDays=[];
    }
    if(dow===6||dow===0){fd.setDate(fd.getDate()+1);continue}
    const dt=byDate[ds]||[];
    cDays.push({ds,dow,num:fd.getDate(),tasks:dt});
    fd.setDate(fd.getDate()+1);
  }
  if(cDays.length)weeks.push({wn:cw,days:cDays});

  const TaskCard=({t,accent,compact})=>(
    <div onClick={()=>onToggle(t.pid,t.si)}
      style={{display:"flex",alignItems:"center",gap:compact?10:14,padding:compact?"10px 12px":"16px 18px",background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:compact?12:16,borderLeft:`3px solid ${t.color}`,cursor:"pointer",opacity:t.done?0.35:1,transition:"opacity .3s"}}>
      <div style={{width:compact?18:24,height:compact?18:24,border:`2px solid ${t.done?C.gn:C.bd2}`,borderRadius:compact?5:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:t.done?C.gn:"transparent",transition:"all .2s"}}>
        {t.done&&<span style={{color:"#fff",fontSize:compact?10:14,fontWeight:700}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:compact?14:17,fontWeight:compact?500:600,textDecoration:t.done?"line-through":"none",color:t.done?C.t3:t.isAfter?C.gn:C.t1}}>{t.isDL?"🎯 ":t.isAfter?"↪ ":""}{t.name}</div>
        <div style={{fontSize:compact?11:13,color:C.t3,marginTop:compact?1:3}}>{t.client}{compact?"":" · "+t.pname}</div>
      </div>
      {accent&&!t.done&&<div style={{width:8,height:8,borderRadius:"50%",background:C.ac,flexShrink:0}}/>}
    </div>
  );

  return(
    <div style={{paddingBottom:80}}>
      {overdue.length>0&&(
        <div style={{marginBottom:16,padding:"16px 18px",background:"rgba(255,71,87,.06)",border:"1px solid rgba(255,71,87,.12)",borderRadius:16}}>
          <div style={{fontSize:15,fontWeight:700,color:C.rd,marginBottom:10}}>⚠️ {overdue.length} försenade</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {overdue.slice(0,3).map(t=>(
              <div key={`o-${t.pid}-${t.si}`} onClick={()=>onToggle(t.pid,t.si)}
                style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:"rgba(255,71,87,.04)",borderRadius:12,cursor:"pointer",border:`1px solid rgba(255,71,87,.1)`}}>
                <div style={{width:20,height:20,border:`2px solid ${C.rd}`,borderRadius:6,flexShrink:0}}/>
                <div style={{flex:1}}><span style={{fontSize:15,fontWeight:600,color:C.rd}}>{t.name}</span></div>
                <span style={{fontSize:13,color:C.t3}}>{t.client}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ===== HERO: TODAY ===== */}
      <div style={{marginBottom:24}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:14}}>
          <div>
            <div style={{fontSize:26,fontWeight:800,color:C.t1}}>{isWeekend?"Helg":"Idag"}</div>
            <div style={{fontSize:15,color:C.ac,fontWeight:600,marginTop:3}}>{DAYS[todayDow]} {today.getDate()} {MONTHS[today.getMonth()]}</div>
          </div>
          {todayUndone.length>0&&(
            <div style={{fontSize:14,color:C.t3}}>{todayDone.length}/{todayTasks.length} klara</div>
          )}
        </div>

        {todayTasks.length===0?(
          <div style={{padding:"32px 24px",background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:16,textAlign:"center"}}>
            <div style={{fontSize:15,color:C.t3}}>{isWeekend?"Njut av helgen 🌿":"Inga uppgifter idag 🎉"}</div>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {todayTasks.map(t=><TaskCard key={`${t.pid}-${t.si}`} t={t} accent/>)}
          </div>
        )}

        {todayTasks.length>0&&(
          <div style={{display:"flex",gap:3,marginTop:10}}>
            {todayTasks.map((t,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:t.done?C.gn:C.bd2,transition:"background .3s"}}/>)}
          </div>
        )}
      </div>

      {/* ===== NEXT UP ===== */}
      {upcoming.length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{fontSize:16,fontWeight:700,color:C.t2,marginBottom:12}}>Nästa upp</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {upcoming.map(day=>(
              <div key={day.date}>
                <div style={{fontSize:13,fontWeight:600,color:C.t3,marginBottom:6,marginLeft:2}}>{DAYS[day.dow]} {day.num} {MONTHS[new Date(day.date).getMonth()]}</div>
                {day.tasks.map(t=>(
                  <TaskCard key={`${t.pid}-${t.si}`} t={t} compact/>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ===== FUTURE WEEKS ===== */}
      {weeks.filter(w=>w.days.some(d=>d.tasks.length>0)).length>0&&(
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{flex:1,height:1,background:C.bd}}/>
            <span style={{fontSize:10,color:C.t3,fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>Längre fram</span>
            <div style={{flex:1,height:1,background:C.bd}}/>
          </div>
          {weeks.map(w=>{
            const cnt=w.days.reduce((s,d)=>s+d.tasks.filter(t=>!t.done).length,0);
            if(cnt===0)return null;
            const isOpen=expanded[w.wn];
            return(
              <div key={w.wn} style={{marginBottom:4}}>
                <div onClick={()=>setExpanded(e=>({...e,[w.wn]:!e[w.wn]}))} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:isOpen?"12px 12px 0 0":12,cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:10,color:C.t3,transition:"transform .2s",transform:isOpen?"rotate(90deg)":"rotate(0)",display:"inline-block"}}>▶</span>
                    <span style={{fontSize:13,fontWeight:600,color:C.t2}}>Vecka {w.wn}</span>
                  </div>
                  <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:8,background:C.ac+"12",color:C.ac}}>{cnt}</span>
                </div>
                {isOpen&&(
                  <div style={{padding:"10px 14px",background:C.bg2,border:`1px solid ${C.bd}`,borderTop:"none",borderRadius:"0 0 12px 12px"}}>
                    {w.days.filter(d=>d.tasks.length>0).map(day=>(
                      <div key={day.ds} style={{marginBottom:8}}>
                        <div style={{fontSize:10,fontWeight:600,color:C.t3,marginBottom:4}}>{DAYS[day.dow]} {day.num}</div>
                        {day.tasks.map(t=>(
                          <TaskCard key={`${t.pid}-${t.si}`} t={t} compact/>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

    </div>
  );
}

// ===== TEMPLATES VIEW =====
function TemplatesView({data,onEdit,onDelete,onNew,onRestore}){
  const [collapsed,setCollapsed]=useState({});
  const toggle=id=>setCollapsed(c=>({...c,[id]:!c[id]}));

  // Group templates by category
  const groups=useMemo(()=>{
    const g=[];
    const placed=new Set();
    CATEGORIES.forEach(cat=>{
      const tpls=data.templates.filter(t=>cat.templates.some(ct=>ct.id===t.id));
      if(tpls.length){g.push({id:cat.id,name:cat.name,icon:cat.icon,templates:tpls});tpls.forEach(t=>placed.add(t.id))}
    });
    const custom=data.templates.filter(t=>!placed.has(t.id));
    if(custom.length)g.push({id:"_custom",name:"Egna mallar",icon:"✏️",templates:custom});
    return g;
  },[data.templates]);

  const TplCard=({t})=>(
    <div onClick={()=>onEdit(t.id)} style={{background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:10,padding:"12px 14px",marginBottom:6,cursor:"pointer"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
        <div><div style={{fontSize:14,fontWeight:600,color:C.t1}}>{t.icon} {t.name}</div><div style={{fontSize:10,color:C.t3,marginTop:2}}>{t.steps.length} steg · {t.steps.reduce((a,x)=>a+x.days,0)} dagar</div></div>
        <button onClick={e=>{e.stopPropagation();onDelete(t.id)}} style={{background:"none",border:"none",color:C.t3,cursor:"pointer",fontSize:12,padding:4}}>✕</button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:6}}>{t.steps.map((s,i)=><span key={i} style={{fontSize:9,padding:"2px 6px",borderRadius:4,background:C.bg4,color:C.t2}}>{s.name}</span>)}</div>
    </div>
  );

  return(
    <div style={{paddingBottom:80}}>
      {data.templates.length===0&&(
        <div style={{padding:"24px 20px",background:C.bg3,border:`1px dashed ${C.ac}50`,borderRadius:14,textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:28,marginBottom:6}}>📋</div>
          <div style={{fontSize:16,fontWeight:700,color:C.t1,marginBottom:4}}>Inga mallar än</div>
          <div style={{fontSize:13,color:C.t3,marginBottom:14}}>Hämta färdiga mallar eller skapa en egen</div>
          <button onClick={onRestore} style={{width:"100%",padding:14,borderRadius:12,background:C.ac,border:"none",color:"#fff",fontSize:15,fontWeight:700,fontFamily:"inherit",cursor:"pointer",marginBottom:8}}>📥 Hämta standardmallar</button>
          <button onClick={onNew} style={{width:"100%",padding:12,borderRadius:12,background:"transparent",border:`1px solid ${C.bd}`,color:C.t2,fontSize:14,fontWeight:600,fontFamily:"inherit",cursor:"pointer"}}>+ Skapa egen mall</button>
        </div>
      )}
      {groups.map(g=>{
        const isOpen=!collapsed[g.id];
        return(
          <div key={g.id} style={{marginBottom:12}}>
            <div onClick={()=>toggle(g.id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:C.bg2,border:`1px solid ${C.bd}`,borderRadius:isOpen?"10px 10px 0 0":10,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:10,color:C.t3,transition:"transform .2s",transform:isOpen?"rotate(90deg)":"rotate(0)",display:"inline-block"}}>▶</span>
                <span style={{fontSize:16}}>{g.icon}</span>
                <span style={{fontSize:14,fontWeight:700,color:C.t1}}>{g.name}</span>
              </div>
              <span style={{fontSize:11,fontWeight:600,padding:"2px 8px",borderRadius:6,background:C.ac+"12",color:C.ac}}>{g.templates.length}</span>
            </div>
            {isOpen&&(
              <div style={{padding:"8px 10px",background:C.bg2+"80",border:`1px solid ${C.bd}`,borderTop:"none",borderRadius:"0 0 10px 10px"}}>
                {g.templates.map(t=><TplCard key={t.id} t={t}/>)}
              </div>
            )}
          </div>
        );
      })}
      {groups.length===0&&<p style={{color:C.t3,fontSize:13,textAlign:"center",padding:40}}>Inga mallar — välj kategorier eller skapa egna.</p>}
      <button onClick={onNew} style={{width:"100%",padding:14,border:`1px dashed ${C.bd}`,borderRadius:12,background:"transparent",color:C.t3,cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>+ Ny mall</button>
    </div>
  );
}

function CalendarOverview({data,month,setMonth,onToggle,onPush}){
  const tasks=useMemo(()=>{
    const t=[];
    data.projects.forEach(p=>{const c=data.clients.find(x=>x.id===p.clientId);
      p.steps.forEach((s,i)=>{const dlI=p.steps.reduce((a,x,j)=>x.after?a:j,-1);t.push({pid:p.id,si:i,name:s.name,date:s.date,done:s.completed,client:c?c.name:"",color:c?c.color:C.ac,pname:p.name,isDL:i===dlI,isAfter:!!s.after,pushed:!!s.pushedToGcal})})});
    return t;
  },[data]);

  const byDate=useMemo(()=>{const m={};tasks.forEach(t=>{if(!m[t.date])m[t.date]=[];m[t.date].push(t)});return m},[tasks]);

  const yr=month.getFullYear(),mo=month.getMonth();
  const offset=(new Date(yr,mo,1).getDay()+6)%7;
  const dim=new Date(yr,mo+1,0).getDate();
  const todayStr=iso(new Date());
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let i=1;i<=dim;i++)cells.push(i);
  while(cells.length%7)cells.push(null);
  const weeks=[];for(let w=0;w<cells.length;w+=7)weeks.push(cells.slice(w,w+7));
  const dsOf=d=>`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const [selDate,setSelDate]=useState(null);
  const selTasks=selDate?byDate[selDate]||[]:[];

  // Count unpushed future tasks
  const unpushed=tasks.filter(t=>!t.pushed&&!t.done&&t.date>=todayStr);

  return(
    <div style={{paddingBottom:80}}>
      {/* Month nav */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <button onClick={()=>setMonth(new Date(yr,mo-1,1))} style={{background:"none",border:"none",color:C.t2,cursor:"pointer",fontSize:18,fontFamily:"inherit",padding:"4px 8px"}}>‹</button>
        <span style={{fontSize:16,fontWeight:700,color:C.t1,textTransform:"capitalize"}}>{MONTHS[mo]} {yr}</span>
        <button onClick={()=>setMonth(new Date(yr,mo+1,1))} style={{background:"none",border:"none",color:C.t2,cursor:"pointer",fontSize:18,fontFamily:"inherit",padding:"4px 8px"}}>›</button>
      </div>

      {/* Calendar grid */}
      <div style={{background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:12,padding:8,marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"36px repeat(7,1fr)",textAlign:"center",marginBottom:2,paddingBottom:6,borderBottom:`2px solid ${C.bd}`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.t3,padding:"4px 0",opacity:0.6}}>V</div>
          {["Mån","Tis","Ons","Tor","Fre","Lör","Sön"].map((d,i)=><div key={d} style={{fontSize:11,fontWeight:700,color:i>=5?C.t3+"70":C.t3,padding:"4px 0"}}>{d}</div>)}
        </div>
        <div>
          {weeks.map((wk,wi)=>{
            const fd=wk.find(x=>x!==null);
            const wn=getWeekNum(dsOf(fd));
            const isCurWeek=wk.some(x=>x!==null&&dsOf(x)===todayStr);
            const wkCount=wk.reduce((a,x)=>a+(x!==null?(byDate[dsOf(x)]||[]).filter(t=>!t.done).length:0),0);
            return(
            <div key={wi} style={{display:"grid",gridTemplateColumns:"36px repeat(7,1fr)",gap:3,alignItems:"stretch",padding:"5px 0",
              borderTop:wi>0?`1px solid ${C.bd}`:"none",background:isCurWeek?C.ac+"10":"transparent",borderRadius:isCurWeek?8:0}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",borderRight:`1px solid ${isCurWeek?C.ac+"50":C.bd}`,
                color:isCurWeek?C.ac:wkCount?C.t2:C.t3,opacity:isCurWeek||wkCount?1:0.55}}>
                <span style={{fontSize:8,fontWeight:600,opacity:0.7,lineHeight:1}}>v.</span>
                <span style={{fontSize:12,fontWeight:800,lineHeight:1.1}}>{wn}</span>
                {wkCount>0&&<span style={{fontSize:8,fontWeight:700,marginTop:2,opacity:0.8}}>{wkCount} st</span>}
              </div>
          {wk.map((d,j)=>{
            const i=wi*7+j;
            if(d===null)return <div key={i}/>;
            const ds=dsOf(d);
            const dayTasks=byDate[ds]||[];
            const isTdy=ds===todayStr;
            const isSel=ds===selDate;
            const isPast=ds<todayStr;
            const colors=[...new Set(dayTasks.filter(t=>!isPast||!t.done).map(t=>t.color))];
            return(
              <div key={i} onClick={()=>setSelDate(ds===selDate?null:ds)}
                style={{padding:"6px 2px 4px",borderRadius:8,cursor:"pointer",textAlign:"center",
                  opacity:isPast?0.3:1,
                  background:isSel?C.ac+"20":isTdy?C.ac+"08":j>=5?C.t3+"12":"transparent",
                  border:isSel?`2px solid ${C.ac}`:isTdy?`2px solid ${C.ac}30`:"2px solid transparent",
                  transition:"all .15s",minHeight:44}}>
                <div style={{fontSize:14,fontWeight:isTdy||isSel?700:400,color:isPast?C.t3:isSel?C.ac:isTdy?C.ac:j>=5?C.t3:C.t1}}>{d}</div>
                {!isPast&&colors.length>0&&(
                  <div style={{display:"flex",gap:2,justifyContent:"center",marginTop:2,flexWrap:"wrap"}}>
                    {colors.slice(0,3).map((cl,ci)=><div key={ci} style={{width:5,height:5,borderRadius:"50%",background:cl}}/>)}
                    {colors.length>3&&<div style={{width:5,height:5,borderRadius:"50%",background:C.t3,fontSize:4,display:"flex",alignItems:"center",justifyContent:"center",color:C.bg}}>+</div>}
                  </div>
                )}
              </div>
            );
          })}
            </div>);
          })}
        </div>
      </div>

      {/* Push to Google Calendar — only unpushed */}
      <button onClick={()=>{if(unpushed.length)onPush();else alert("Alla uppgifter är redan synkade!")}}
        style={{width:"100%",padding:"12px 16px",background:unpushed.length?C.bg3:C.bg3,border:`1px solid ${unpushed.length?C.ac+"50":C.bd}`,borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:16,fontFamily:"inherit",opacity:unpushed.length?1:0.5}}>
        <span style={{fontSize:16}}>📤</span>
        <span style={{fontSize:13,fontWeight:600,color:unpushed.length?C.ac:C.t3}}>
          {unpushed.length?`Pusha ${unpushed.length} nya till Google Calendar`:"✓ Allt synkat"}
        </span>
      </button>

      {/* Selected day detail */}
      {selDate&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:8}}>{fmtDay(selDate)} {fmtShort(selDate)}</div>
          {selTasks.length===0?(
            <div style={{padding:16,background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:10,textAlign:"center"}}>
              <span style={{fontSize:12,color:C.t3}}>Inga uppgifter</span>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {selTasks.map(t=>(
                <div key={`${t.pid}-${t.si}`} onClick={()=>onToggle(t.pid,t.si)}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:10,borderLeft:`3px solid ${t.color}`,cursor:"pointer",opacity:t.done?0.35:1,transition:"opacity .3s"}}>
                  <div style={{width:18,height:18,border:`2px solid ${t.done?C.gn:C.bd2}`,borderRadius:5,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:t.done?C.gn:"transparent"}}>
                    {t.done&&<span style={{color:"#fff",fontSize:10,fontWeight:700}}>✓</span>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:t.done?C.t3:t.isAfter?C.gn:C.t1,textDecoration:t.done?"line-through":"none"}}>{t.isDL?"🎯 ":t.isAfter?"↪ ":""}{t.name}</div>
                    <div style={{fontSize:10,color:C.t3}}>{t.client} · {t.pname}</div>
                  </div>
                  {t.pushed&&<span style={{fontSize:9,color:C.gn}}>☁️</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Month summary */}
      {(()=>{
        const monthTasks=tasks.filter(t=>t.date.startsWith(`${yr}-${String(mo+1).padStart(2,"0")}`));
        const done=monthTasks.filter(t=>t.done).length;
        const total=monthTasks.length;
        if(!total)return null;
        const pushed=monthTasks.filter(t=>t.pushed).length;
        return(
          <div style={{background:C.bg3,border:`1px solid ${C.bd}`,borderRadius:10,padding:12}}>
            <div style={{fontSize:11,fontWeight:700,color:C.t3,marginBottom:6,textTransform:"uppercase"}}>Sammanfattning</div>
            <div style={{display:"flex",justifyContent:"space-around",textAlign:"center"}}>
              <div><div style={{fontSize:20,fontWeight:800,color:C.t1}}>{total}</div><div style={{fontSize:10,color:C.t3}}>Uppgifter</div></div>
              <div><div style={{fontSize:20,fontWeight:800,color:C.gn}}>{done}</div><div style={{fontSize:10,color:C.t3}}>Klara</div></div>
              <div><div style={{fontSize:20,fontWeight:800,color:total-done>0?C.step:C.gn}}>{total-done}</div><div style={{fontSize:10,color:C.t3}}>Kvar</div></div>
              <div><div style={{fontSize:20,fontWeight:800,color:pushed?C.ac:C.t3}}>{pushed}</div><div style={{fontSize:10,color:C.t3}}>Synkade</div></div>
            </div>
            {total>0&&<div style={{display:"flex",gap:2,marginTop:8}}><div style={{flex:done,height:4,borderRadius:2,background:C.gn,transition:"flex .5s"}}/><div style={{flex:total-done||0.01,height:4,borderRadius:2,background:C.bd2}}/></div>}
          </div>
        );
      })()}
    </div>
  );
}

// ===== MAIN =====
function App(){
  const [theme,setTheme]=useState("midnight");
  C=THEMES[theme]; // Update module-level C each render

  // Auth flow
  const [authState,setAuthState]=useState(null); // null=login, {type,email?}
  const [authLoading,setAuthLoading]=useState(true);
  const [showCatPicker,setShowCatPicker]=useState(false);

  const [data,setData]=useState({clients:[],templates:[],projects:[]});
  const dataLoaded=useRef(false);
  const [syncError,setSyncError]=useState(null);
  const [syncInfo,setSyncInfo]=useState({loaded:null,saved:null,loadedTpls:null});
  const [tab,setTab]=useState("week");
  const [toast,setToast]=useState("");
  const [showOnboard,setShowOnboard]=useState(false);

  // Auto-restore session on mount
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(user)=>{
      if(user){
        const info={type:user.providerData[0]?.providerId==="google.com"?"google":"email",email:user.email,uid:user.uid};
        setAuthState(info);
        const res=await loadUserData(user.uid);
        let local=null;try{local=JSON.parse(localStorage.getItem("df_"+user.uid)||"null")}catch(e){}
        const localHasData=local&&((local.templates||[]).length||(local.projects||[]).length);
        if(!res.ok){
          // Cloud unreachable — use local backup if we have one
          setSyncError(res.error);
          if(localHasData){setData(local);dataLoaded.current=true}
          setShowOnboard(false);setShowCatPicker(false);
          setAuthLoading(false);
          return;
        }
        setSyncError(null);
        let saved=res.data;
        if(localHasData&&(!saved||(local.updatedAt||0)>(saved.updatedAt||0)||!(saved.templates||[]).length)){
          saved={...local,aiKey:saved?.aiKey||local.aiKey};
        }
        setSyncInfo(si=>({...si,loaded:new Date().toLocaleTimeString("sv-SE"),loadedTpls:saved&&saved.templates?saved.templates.length:0}));
        if(saved&&saved.projects){
          if(saved.aiKey)setAiKey(saved.aiKey);
          const {aiKey:_,...rest}=saved;
          setData(rest);
          dataLoaded.current=true;
          setShowOnboard(false);
          // If templates got wiped, show category picker to restore them
          if(!rest.templates||rest.templates.length===0){
            setShowCatPicker(true);
          }else{
            setShowCatPicker(false);
          }
        }else{
          dataLoaded.current=true;
          setShowOnboard(true);
        }
      }
      setAuthLoading(false);
    });
    return ()=>unsub();
  },[]);
  const [calOverviewMonth,setCalOverviewMonth]=useState(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1)});

  // Project creation - single view
  const [wiz,setWiz]=useState(false);
  const [pClient,setPClient]=useState("");
  const [pTpl,setPTpl]=useState("");
  const [pName,setPName]=useState("");
  const [pDL,setPDL]=useState("");
  const [pColor,setPColor]=useState(CLIENT_COLORS[0]);
  const [pSkipWknd,setPSkipWknd]=useState(true);
  const [showColors,setShowColors]=useState(false);
  const [clientFocus,setClientFocus]=useState(false);
  const [calMonth,setCalMonth]=useState(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),1)});
  const [pCustomSteps,setPCustomSteps]=useState(null);
  const [movingIdx,setMovingIdx]=useState(-1);
  const wizLongPress=useRef(null);
  const [wizDragOver,setWizDragOver]=useState(null);
  const dragNavTimer=useRef(null);
  const [showPushPopup,setShowPushPopup]=useState(false);
  const [aiText,setAiText]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiOpen,setAiOpen]=useState(false);
  const [aiKey,setAiKey]=useState("");

  // Template modal
  const [tplOpen,setTplOpen]=useState(false);
  const [tplName,setTplName]=useState("");
  const [tplSteps,setTplSteps]=useState([]);
  const [editTplId,setEditTplId]=useState(null);

  const msg=m=>{setToast(m);setTimeout(()=>setToast(""),3000)};
  const upd=useCallback(fn=>{setData(d=>{const n=JSON.parse(JSON.stringify(d));fn(n);n.updatedAt=Date.now();return n})},[]);
  const toggle=useCallback((pid,si)=>{upd(d=>{const p=d.projects.find(x=>x.id===pid);if(p)p.steps[si].completed=!p.steps[si].completed})},[upd]);

  // Push unpushed future steps to Google Calendar
  const pushToGcal=useCallback(async()=>{
    // Check if Google auth
    if(!authState||authState.type==="test"){
      msg("⚠️ Logga in för att pusha till kalender");return;
    }

    // Get token — may need re-auth
    let token=googleAccessToken;
    if(!token){
      if(authState.type!=="google"){
        msg("⚠️ Logga in med Google för att pusha till kalendern");return;
      }
      token=await getGoogleCalendarToken();
      if(!token){msg("❌ Kunde inte ansluta till Google Calendar");return}
    }

    const todayStr=iso(new Date());
    const toPush=[];
    data.projects.forEach(p=>{
      const cl=data.clients.find(c=>c.id===p.clientId);
      p.steps.forEach((s,si)=>{
        if(!s.pushedToGcal&&!s.completed&&s.date>=todayStr){
          toPush.push({pid:p.id,si,name:`${s.name} — ${cl?cl.name:""} (${p.name})`,date:s.date,reminders:s.reminders||["1d"]});
        }
      });
    });

    if(!toPush.length){msg("✓ Allt är redan synkat!");return}

    msg(`📤 Pushar ${toPush.length} events...`);
    let ok=0,fail=0;

    for(const item of toPush){
      try{
        await pushEventToGCal(token,item.name,item.date,item.reminders);
        upd(d=>{const p=d.projects.find(x=>x.id===item.pid);if(p)p.steps[item.si].pushedToGcal=true});
        ok++;
      }catch(e){
        console.error("GCal push error:",e);
        if(e.message.includes("Invalid Credentials")||e.message.includes("401")){
          token=await getGoogleCalendarToken();
          if(token){
            try{
              await pushEventToGCal(token,item.name,item.date,item.reminders);
              upd(d=>{const p=d.projects.find(x=>x.id===item.pid);if(p)p.steps[item.si].pushedToGcal=true});
              ok++;continue;
            }catch(e2){fail++}
          }else{fail++}
        }else{fail++}
      }
    }
    if(fail)msg(`☁️ ${ok} pushade, ${fail} misslyckades`);
    else msg(`☁️ ${ok} uppgifter pushade till Google Calendar!`);
  },[upd,data,authState]);

  // Local backup — written instantly on every change
  useEffect(()=>{
    if(!authState||!dataLoaded.current)return;
    const key=authState.type==="test"?"df_test":"df_"+authState.uid;
    try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}
  },[data,authState]);

  // Cloud sync — save to Firestore on every change (only after data loaded)
  const saveTimer=useRef(null);
  useEffect(()=>{
    if(!authState||authState.type==="test")return;
    if(!dataLoaded.current)return; // Don't save before data is loaded!
    if(!data.templates?.length&&!data.projects?.length&&!data.clients?.length)return; // Never overwrite with empty data
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      saveUserData(authState.uid,{...data,aiKey}).then(r=>{if(!r.ok)setSyncError(r.error);else{setSyncError(null);setSyncInfo(si=>({...si,saved:new Date().toLocaleTimeString("sv-SE")}))}});
    },400);
    return ()=>{if(saveTimer.current)clearTimeout(saveTimer.current)};
  },[data,authState,aiKey]);

  // Login handler — only used for test mode (real auth handled by onAuthStateChanged)
  const handleLogin=async(info)=>{
    if(info.type==="test"){
      let local=null;try{local=JSON.parse(localStorage.getItem("df_test")||"null")}catch(e){}
      setAuthState(info);
      if(local&&((local.templates||[]).length||(local.projects||[]).length)){
        setData(local);dataLoaded.current=true;setShowOnboard(false);setShowCatPicker(false);
      }else{dataLoaded.current=true;setShowOnboard(true)}
    }
    // For email/google: Firebase auth triggers onAuthStateChanged which loads data
  };

  // Category picker done
  const handleCatDone=(catIds)=>{
    setShowCatPicker(false);
    const tpls=CATEGORIES.filter(c=>catIds.includes(c.id)).flatMap(c=>c.templates);
    upd(d=>{const have=new Set((d.templates||[]).map(t=>t.id));d.templates=[...(d.templates||[]),...tpls.filter(t=>!have.has(t.id))]});
    msg("✅ Mallar laddade!");
  };

  // Logout
  const handleLogout=async()=>{
    dataLoaded.current=false;
    try{await auth.signOut()}catch(e){}
    setAuthState(null);setData({clients:[],templates:[],projects:[]});
    setShowOnboard(true);setShowCatPicker(false);setTab("week");
  };

  // === PROJECT CREATION ===
  const startWiz=()=>{
    setPClient("");setPTpl(data.templates[0]?.id||"");setPName("");setPDL("");setPSkipWknd(true);setShowColors(false);setClientFocus(false);
    setPCustomSteps(null);setMovingIdx(-1);setWizDragOver(null);setAiText("");setAiOpen(false);setAiLoading(false);
    const used=data.clients.map(c=>c.color);setPColor(CLIENT_COLORS.find(c=>!used.includes(c))||CLIENT_COLORS[0]);
    setCalMonth(new Date(new Date().getFullYear(),new Date().getMonth(),1));
    setWiz(true);
  };

  // === AI QUICK CREATE ===
  const aiParse=async()=>{
    if(!aiText.trim()||aiLoading)return;
    if(!aiKey.trim()){msg("⚠️ Lägg till din Anthropic API-nyckel under Konto");return}
    setAiLoading(true);
    try{
      const tplList=data.templates.map(t=>`id:"${t.id}" name:"${t.name}" steps:${t.steps.length}`).join("\n");
      const clientList=data.clients.map(c=>`name:"${c.name}"`).join(", ");
      const today=new Date();
      const yearHint=today.getFullYear();

      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":aiKey.trim(),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          messages:[{role:"user",content:`Du är en JSON-parser för en projektplaneringsapp. Tolka användarens text och returnera BARA JSON (ingen markdown, inga backticks).

Tillgängliga mallar:
${tplList}

Befintliga kunder: ${clientList||"inga"}

Dagens datum: ${iso(today)}
År att anta om inget anges: ${yearHint}

Användarens text: "${aiText}"

Returnera JSON med exakt dessa fält:
{"template_id":"...", "client":"...", "deadline":"YYYY-MM-DD", "project_name":"..."}

          <div style={{flex:1}}>
            Synk till molnet fungerar inte — ändringar sparas inte.
            <div style={{fontSize:11,fontWeight:400,opacity:0.85,marginTop:2}}>{syncError==="permission-denied"?"Firestore-reglerna nekar åtkomst (troligen utgånget test mode).":"Fel: "+syncError}</div>
          </div>
          <button onClick={()=>location.reload()} style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Försök igen</button>
        </div>
      )}
      {toast&&<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",padding:"10px 20px",background:C.bg4,border:`1px solid ${C.gn}`,borderRadius:10,fontSize:13,fontWeight:500,zIndex:2000,color:C.t1,whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

    // ===== MOUNT =====
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
